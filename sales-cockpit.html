<title>TextUs Sales Cockpit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600&family=Raleway:ital,wght@0,400;0,500;0,600;1,500&display=swap">
<style>
/* Layout: navy app bar with the owner toggle; one work column below. Today is a flat checklist, Accounts is a ledger, an account is tasks + notes beside contacts + Gong. */
:root {
  --navy: #1D4277;
  --blue: #069FFF;
  --green: #02E584;
  --purple: #D26AE9;
  --bg: #F6F7F9;
  --surface: #FFFFFF;
  --surface-2: #EEF2F8;
  --ink: #17191B;
  --heading: #1D4277;
  --muted: #5A6880;
  --line: #DCE3EE;
  --link: #0A78C2;
  --btn: #1D4277;
  --btn-ink: #FFFFFF;
  --btn-2: #E4ECF7;
  --btn-2-ink: #1D4277;
  --focus: #069FFF;
  --ok: #0B8A55; --ok-soft: #DDF8EC;
  --bad: #C13540; --bad-soft: #FBE6E8;
  --warn: #9A6B00; --warn-soft: #FFF3D6;
  --gong: #9B3DB4; --gong-soft: #F8EAFC;
  --deal-soft: #E1F2FF; --deal-ink: #0A5E99;
  --tgt-soft: #DDF8EC; --tgt-ink: #0B7A4B;
  --c-call: #0A78C2; --c-li: #0E9A5F; --c-email: #B04FCC;
  --bar: #1D4277; --bar-ink: #FFFFFF; --bar-muted: #AFC3E2; --bar-seg: #16365F; --bar-seg-on: #FFFFFF; --bar-seg-on-ink: #1D4277;
  --font-head: 'Alexandria', 'Helvetica Neue', Arial, sans-serif;
  --font-body: 'Raleway', 'Helvetica Neue', Arial, sans-serif;
  --grad: linear-gradient(90deg, #069FFF 0%, #02E584 100%);
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1524; --surface: #132036; --surface-2: #1A2A45; --ink: #E8EDF5; --heading: #F2F6FB; --muted: #9AA9C0; --line: #26385A;
    --link: #5CC0FF; --btn: #069FFF; --btn-ink: #0C1524; --btn-2: #1F3253; --btn-2-ink: #D9E6F7; --focus: #5CC0FF;
    --ok: #3FE3A0; --ok-soft: #0F3427; --bad: #FF8A93; --bad-soft: #3B1A20; --warn: #F2C35B; --warn-soft: #382B10;
    --gong: #E6A2F5; --gong-soft: #31203D; --deal-soft: #12304F; --deal-ink: #8FD0FF; --tgt-soft: #0F3427; --tgt-ink: #4BE3A6; --c-call: #2E9BE6; --c-li: #1FAF72; --c-email: #C05AD8;
    --bar: #102446; --bar-ink: #FFFFFF; --bar-muted: #93A8C8; --bar-seg: #0A1830; --bar-seg-on: #E8EDF5; --bar-seg-on-ink: #102446;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1524; --surface: #132036; --surface-2: #1A2A45; --ink: #E8EDF5; --heading: #F2F6FB; --muted: #9AA9C0; --line: #26385A;
  --link: #5CC0FF; --btn: #069FFF; --btn-ink: #0C1524; --btn-2: #1F3253; --btn-2-ink: #D9E6F7; --focus: #5CC0FF;
  --ok: #3FE3A0; --ok-soft: #0F3427; --bad: #FF8A93; --bad-soft: #3B1A20; --warn: #F2C35B; --warn-soft: #382B10;
  --gong: #E6A2F5; --gong-soft: #31203D; --deal-soft: #12304F; --deal-ink: #8FD0FF; --tgt-soft: #0F3427; --tgt-ink: #4BE3A6; --c-call: #2E9BE6; --c-li: #1FAF72; --c-email: #C05AD8;
  --bar: #102446; --bar-ink: #FFFFFF; --bar-muted: #93A8C8; --bar-seg: #0A1830; --bar-seg-on: #E8EDF5; --bar-seg-on-ink: #102446;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bar); }
h1, h2, h3 { font-family: var(--font-head); color: var(--heading); margin: 0; text-wrap: balance; font-weight: 500; }
h1 { font-size: 30px; line-height: 1.15; letter-spacing: -.01em; }
h2 { font-size: 15px; font-weight: 500; letter-spacing: .01em; }
h3 { font-size: 14px; }
a { color: var(--link); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.eyebrow { font-family: var(--font-head); font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* App bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bar); color: var(--bar-ink); }
.bar::after { content: ""; display: block; height: 3px; background: var(--grad); }
.bar-in { max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
.brand img { height: 30px; width: auto; display: block; }
.brand span { font-family: var(--font-head); font-weight: 300; font-size: 15px; color: var(--bar-muted); border-left: 1px solid rgba(255,255,255,.25); padding-left: 12px; white-space: nowrap; }
.nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav a { color: var(--bar-muted); text-decoration: none; font-family: var(--font-head); font-size: 14px; padding: 7px 10px; border-radius: 8px; display: inline-flex; gap: 7px; align-items: center; }
.nav a:hover { color: var(--bar-ink); }
.nav a[aria-current="page"] { color: var(--bar-ink); background: rgba(255,255,255,.1); }
.nav .count { background: var(--blue); color: #0C1524; border-radius: 999px; font-size: 11px; padding: 0 7px; line-height: 18px; font-weight: 600; }
.nav .count.over { background: #FF8A93; }
.bar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
@media (max-width: 1240px) and (min-width: 641px) { .brand span { display: none; } }
.seg { display: inline-flex; background: var(--bar-seg); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; color: var(--bar-muted); padding: 5px 13px; border-radius: 999px; font-family: var(--font-head); font-size: 13px; cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--bar-seg-on); color: var(--bar-seg-on-ink); }
.who { font-size: 13px; color: var(--bar-muted); display: flex; align-items: center; gap: 6px; }
.who select { background: var(--bar-seg); color: var(--bar-ink); border: 0; border-radius: 6px; padding: 3px 6px; font-size: 13px; }

/* Page */
main { max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 26px 64px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
main > section, main > section > div { min-width: 0; }
main > section > div { grid-template-columns: minmax(0, 1fr); }
.banner { border-radius: var(--radius); padding: 10px 14px; font-size: 14px; background: var(--warn-soft); color: var(--warn); }
.banner.info { background: var(--deal-soft); color: var(--deal-ink); }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.page-head .sub { font-family: var(--font-head); font-weight: 300; font-size: 15px; color: var(--muted); margin-top: 4px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px 10px; flex-wrap: wrap; }
.panel-body { padding: 0 16px 16px; display: grid; gap: 10px; }

/* Buttons and fields */
.btn { display: inline-flex; align-items: center; gap: 7px; border: 0; border-radius: 8px; padding: 8px 14px; background: var(--btn); color: var(--btn-ink); font-family: var(--font-head); font-size: 13.5px; cursor: pointer; white-space: nowrap; text-decoration: none; }
.btn:hover { filter: brightness(1.08); }
.btn.sec { background: var(--btn-2); color: var(--btn-2-ink); }
.btn.ghost { background: transparent; color: var(--muted); padding: 6px 8px; }
.btn.ghost:hover { color: var(--ink); background: var(--surface-2); filter: none; }
.btn.danger { background: var(--bad-soft); color: var(--bad); }
.btn.gong { background: var(--gong-soft); color: var(--gong); }
.btn[disabled] { opacity: .5; cursor: not-allowed; filter: none; }
.icon-btn { border: 0; background: transparent; color: var(--muted); padding: 5px; border-radius: 6px; cursor: pointer; display: inline-flex; }
.icon-btn:hover { color: var(--ink); background: var(--surface-2); }
.field, .sel { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 10px; min-width: 0; font-size: 14px; }
.field:focus, .sel:focus { border-color: var(--focus); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 25%, transparent); }
textarea.field { resize: vertical; min-height: 70px; width: 100%; line-height: 1.5; }
.row-form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row-form .grow { flex: 1 1 220px; }
label.lbl { display: grid; gap: 4px; font-size: 12px; color: var(--muted); font-family: var(--font-head); }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; align-items: end; }

/* Pills */
.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; font-size: 12px; padding: 2px 9px; font-family: var(--font-head); white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.pill.deal { background: var(--deal-soft); color: var(--deal-ink); }
.pill.out { background: var(--surface-2); color: var(--heading); }
.pill.over { background: var(--bad-soft); color: var(--bad); }
.pill.today { background: var(--deal-soft); color: var(--deal-ink); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.gong { background: var(--gong-soft); color: var(--gong); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.owner-dot { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; font-family: var(--font-head); font-size: 11px; background: var(--surface-2); color: var(--heading); flex: none; }

/* Checkbox */
.chk { appearance: none; -webkit-appearance: none; width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--line); background: var(--surface); cursor: pointer; flex: none; display: grid; place-items: center; margin: 0; }
.chk:hover { border-color: var(--ok); }
.chk:checked { background: var(--ok); border-color: var(--ok); }
.chk:checked::after { content: ""; width: 5px; height: 10px; border: solid var(--surface); border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }

/* Today */
.focus-stats { display: flex; gap: 8px; flex-wrap: wrap; }
.stat { display: flex; align-items: baseline; gap: 7px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px 14px 14px 4px; padding: 8px 14px; }
.stat b { font-family: var(--font-head); font-weight: 500; font-size: 22px; color: var(--heading); }
.stat.over b { color: var(--bad); }
.stat span { font-size: 13px; color: var(--muted); }
.tasklist { list-style: none; margin: 0; padding: 0; }
.tasklist > li { display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); }
.tasklist > li:first-child { border-top: 0; }
.tasklist .t-main { flex: 1; min-width: 0; display: grid; gap: 3px; }
.tasklist .t-title { font-weight: 500; overflow-wrap: anywhere; }
.tasklist .t-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--muted); align-items: center; }
.tasklist .t-meta a { color: var(--link); text-decoration: none; font-weight: 500; }
.tasklist .t-meta a:hover { text-decoration: underline; }
.tasklist .t-side { display: flex; align-items: center; gap: 6px; flex: none; }
.tasklist li.done .t-title { text-decoration: line-through; color: var(--muted); }
.group-label { padding: 12px 16px 4px; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); display: grid; gap: 6px; justify-items: center; }
.empty .bubble { font-family: var(--font-head); color: var(--heading); font-size: 17px; background: var(--surface-2); border-radius: 16px 16px 16px 4px; padding: 10px 16px; }

/* Accounts */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
.tabs button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; color: var(--muted); font-family: var(--font-head); font-size: 13.5px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.tabs button[aria-pressed="true"] { background: var(--navy); color: #FFFFFF; }
:root[data-theme="dark"] .tabs button[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tabs button[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); } }
.tabs .n { font-size: 11px; opacity: .75; }
.tools-r { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.table-wrap { overflow-x: auto; }
table.book { width: 100%; border-collapse: collapse; min-width: 680px; }
.book th { text-align: left; font-family: var(--font-head); font-weight: 400; font-size: 12px; color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.book td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.book tr:last-child td { border-bottom: 0; }
.book tbody tr { cursor: pointer; }
.book tbody tr:hover td { background: var(--surface-2); }
.book .co { font-weight: 600; color: var(--heading); }
.book .dom { font-size: 12.5px; color: var(--muted); }
.book .r { text-align: right; }
.taskcount { display: inline-flex; align-items: center; gap: 6px; }
.taskcount .od { width: 7px; height: 7px; border-radius: 50%; background: var(--bad); }
.sync-line { font-size: 13px; color: var(--muted); }
.sync-line.err { color: var(--bad); }

/* Detail */
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; font-size: 14px; }
.back:hover { color: var(--ink); }
.acct-head { padding: 18px 18px 16px; display: grid; gap: 14px; }
.acct-title { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.acct-title h1 { font-size: 28px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px 18px; }
.fact { display: grid; gap: 3px; min-width: 0; }
.fact .v { font-family: var(--font-head); font-size: 15px; color: var(--heading); overflow-wrap: anywhere; }
.fact .v.big { font-size: 20px; }
.fact select.sel { padding: 4px 8px; }
.detail-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.col { display: grid; gap: 18px; min-width: 0; }
@media (max-width: 860px) { .detail-grid { grid-template-columns: minmax(0, 1fr); } }
.sugg { border: 1px dashed color-mix(in srgb, var(--gong) 55%, transparent); background: var(--gong-soft); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; }
.sugg-item { display: flex; gap: 10px; align-items: flex-start; }
.sugg-item p { margin: 0; flex: 1; min-width: 0; font-size: 14px; }
.sugg-item .acts { display: flex; gap: 4px; flex: none; }
.edit-row { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; }
.edit-row .field { flex: 1 1 180px; }
details.done-box summary { cursor: pointer; padding: 10px 16px; color: var(--muted); font-size: 13.5px; list-style: none; border-top: 1px solid var(--line); }
details.done-box summary::-webkit-details-marker { display: none; }
.contact { display: grid; gap: 6px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; }
.contact.primary { border-color: color-mix(in srgb, var(--blue) 55%, var(--line)); }
.contact-top { display: flex; align-items: flex-start; gap: 8px; }
.contact-top .nm { flex: 1; min-width: 0; }
.contact-top .nm b { display: block; color: var(--heading); font-weight: 600; overflow-wrap: anywhere; }
.contact-top .nm span { font-size: 13px; color: var(--muted); }
.contact .lines { display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
.contact .lines span { user-select: all; overflow-wrap: anywhere; }
.contact .foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.star { border: 0; background: transparent; cursor: pointer; color: var(--muted); padding: 3px; border-radius: 6px; display: inline-flex; }
.star.on { color: var(--blue); }
.star.on svg { fill: currentColor; }
.notes { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.note { display: grid; gap: 4px; }
.note .msg { background: var(--surface-2); border-radius: 14px 14px 14px 4px; padding: 10px 13px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; }
.note .by { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.gong-ctx { display: grid; gap: 8px; }
.gong-ctx .msg { background: var(--surface-2); border-radius: 14px 14px 4px 14px; padding: 10px 13px; font-size: 14px; }
.spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
.err { color: var(--bad); font-size: 13.5px; }
.danger-zone { display: flex; justify-content: flex-end; gap: 8px; align-items: center; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 14px; z-index: 50; display: flex; gap: 12px; align-items: center; max-width: calc(100% - 32px); }
.toast[hidden] { display: none; }
.toast button { background: transparent; border: 0; color: var(--blue); font-weight: 600; cursor: pointer; padding: 0; }
@media (max-width: 640px) {
  .brand span { display: none; }
  .bar-right { margin-left: 0; width: 100%; justify-content: space-between; }
  h1 { font-size: 25px; }
  .tasklist > li { padding: 12px; }
}

/* Filters */
.filters { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: flex-end; }
.filters label.lbl { min-width: 0; }
.filters .sel, .filters .field { padding: 6px 9px; font-size: 13.5px; }
.filters .clear { align-self: center; }
.result-note { font-size: 13px; color: var(--muted); }

/* Contacts, sourced */
.tier { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; font-family: var(--font-head); white-space: nowrap; }
.tier.t1 { background: var(--deal-soft); color: var(--deal-ink); }
.tier.t2 { background: var(--gong-soft); color: var(--gong); }
.tier.t3 { background: var(--surface-2); color: var(--heading); }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; padding: 1px 8px; border-radius: 999px; white-space: nowrap; background: var(--surface-2); color: var(--muted); text-decoration: none; font-family: var(--font-head); }
a.chip:hover { color: var(--ink); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.cline { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 13px; }
.cline .k { font-family: var(--font-head); font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); width: 52px; flex: none; }
.cline .v { overflow-wrap: anywhere; user-select: all; min-width: 0; font-variant-numeric: tabular-nums; }
.copy { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 6px; font-size: 11px; padding: 0 7px; line-height: 20px; cursor: pointer; flex: none; }
.copy:hover { color: var(--ink); }
.copy.done { color: var(--ok); border-color: var(--ok); }
.flags { display: flex; flex-wrap: wrap; gap: 4px; }
.calls-note { font-size: 11.5px; color: var(--muted); }
.li-check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
.li-check input { width: 16px; height: 16px; accent-color: var(--blue); }

/* Find targets */
.intake { display: grid; grid-template-columns: minmax(0, 150px) minmax(0, 1fr) auto; gap: 10px; align-items: end; }
@media (max-width: 720px) { .intake { grid-template-columns: minmax(0, 1fr); } }
.intake textarea.field { min-height: 44px; }

.detail-grid > .col:first-child { order: 2; }
.detail-grid > .col:last-child { order: 1; }
@media (max-width: 900px) { .detail-grid { grid-template-columns: minmax(0, 1fr); } .detail-grid > .col:first-child { order: 1; } .detail-grid > .col:last-child { order: 2; } }

/* MQLs + Signals */
.kind.inb { background: var(--gong-soft); color: var(--gong); }
.ds.inb b { color: var(--gong); }
.chip.hotc { background: var(--deal-soft); color: var(--deal-ink); }
.mlist { list-style: none; margin: 0; padding: 0; }
.mrow { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1.25fr) minmax(0, .65fr) minmax(0, 1fr) auto; gap: 10px 16px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); }
.mrow:first-child { border-top: 0; }

.m-main, .m-what, .m-when, .m-touch { min-width: 0; display: grid; gap: 3px; }
.m-name { font-family: var(--font-head); font-size: 15px; color: var(--heading); text-decoration: none; overflow-wrap: anywhere; }
.m-name:hover { text-decoration: underline; }
.m-who { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.m-who a { color: var(--link); }
.m-what b, .m-when b { font-weight: 600; font-size: 13.5px; color: var(--ink); }
.m-acts { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; align-items: center; }
.sm-btn-solid { padding: 5px 11px; font-size: 12.5px; }

.hs-confirm { grid-column: 1 / -1; display: grid; gap: 8px; padding: 12px 14px; border-radius: 10px; background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); }

  function renderSchedule() {
    renderUpNext(); renderDayStrip();

    const owners = calOwners(); const d = calDate();
    const whose = owners.length > 1 ? "Team agenda" : owners[0] === S.myOwner ? "Agenda" : `${owners[0]}'s agenda`;
    const head = `<div class="panel-head"><h2>${esc(whose)}</h2><div class="row-form" style="gap:4px">
        <div class="tabs cal-day" role="group" aria-label="Day"><button type="button" data-calday="today" aria-pressed="${S.cal.day === "today"}">Today</button><button type="button" data-calday="tomorrow" aria-pressed="${S.cal.day === "tomorrow"}">Tomorrow</button></div>

    const now = Date.now(); const isToday = d === today();
    const idx = domainIndex();
    const evs = S.cal.events.filter((e) => !e.ooo);

      return `<li class="ev ${state} ${e.mtg ? "mtg" : "solo"} ${e.extDomains.length ? "ext" : ""}">
        <span class="ev-t num">${esc(fmtTime(e.s))}</span>
        <div class="ev-main"><a class="ev-title" href="${esc(e.link)}" target="_blank" rel="noopener">${esc(e.title)}</a>
          <div class="ev-meta"><span class="small muted num">${esc(fmtTime(e.s))}–${esc(fmtTime(e.e))}</span>${owners.length > 1 ? e.owners.map((o) => `<span class="owner-dot" title="${esc(o)}">${esc(initial(o))}</span>`).join("") : ""}${accs}${e.extDomains.length && !accs ? `<span class="chip">External</span>` : ""}${srcTag(e)}${e.join && state !== "past" ? `<a class="join-link" href="${esc(e.join)}" target="_blank" rel="noopener">Join</a>` : ""}</div></div></li>`;
    };
    // Weave in a Now line and open stretches (30+ min, 8am–6pm) so free call time is visible.
    const out = []; let nowPlaced = !isToday;
    const dayAt = (h) => { const x = new Date(d + "T00:00:00"); x.setHours(h, 0, 0, 0); return x.getTime(); };
    const wStart = dayAt(8), wEnd = dayAt(18);
    let cursor = wStart;
    const gap = (from, to) => {
      const a = Math.max(from, wStart, isToday ? now : 0), b = Math.min(to, wEnd);
      if (b - a >= 30 * 60000) { const m = Math.round((b - a) / 60000); out.push(`<li class="gap"><span class="ev-t num">${esc(fmtTime(new Date(a).toISOString()))}</span><span>Open · ${m >= 60 ? `${Math.floor(m / 60)}h${m % 60 ? " " + (m % 60) + "m" : ""}` : m + " min"}</span></li>`); }
    };
    for (const e of evs) {
      const st = new Date(e.s).getTime(), en = new Date(e.e).getTime();
      if (!nowPlaced && st > now) { out.push(`<li class="now-line" aria-label="Now"><span>Now · ${esc(fmtTime(new Date(now).toISOString()))}</span></li>`); nowPlaced = true; }
      gap(cursor, st);
      out.push(item(e));
      cursor = Math.max(cursor, en);
    }
    if (!nowPlaced && now < wEnd + 6 * 3600e3) out.push(`<li class="now-line" aria-label="Now"><span>Now · ${esc(fmtTime(new Date(now).toISOString()))}</span></li>`);
    gap(cursor, wEnd);
    const allDay = S.cal.allDay.length ? `<div class="flags" style="padding:0 0 8px">${S.cal.allDay.map((a) => `<span class="chip ${a.ooo ? "warn" : ""}">${owners.length > 1 ? esc(initial(a.owner)) + " · " : ""}All day: ${esc(a.title)}</span>`).join("")}</div>` : "";
    const errs = S.cal.errs.map((x) => `<div class="err" style="margin-bottom:8px">${esc(x)}</div>`).join("");
    el.innerHTML = head + `<div class="agenda-body">${errs}${allDay}${evs.length ? `<ul class="evs">${out.join("")}</ul>` : `<div class="empty small"><span class="bubble">${isToday ? "Nothing on the calendar today." : "Nothing on the calendar tomorrow."}</span></div>`}
      ${S.cal.at ? `<div class="small muted agenda-foot">Updated ${esc(fmtTime(new Date(S.cal.at).toISOString()))}</div>` : ""}</div>`;
  }

  // ---------- connectors ----------
  function payloadOf(result) {
    let p = result && result.payload !== undefined ? result.payload : result;
    if (p && p.structuredContent) p = p.structuredContent;
    else if (p && Array.isArray(p.content) && !p.data && !p.records) { const t = p.content.find((c) => c.type === "text"); if (t) p = t.text; }
    if (typeof p === "string") { const i = p.search(/[\[{]/); if (i >= 0) { try { p = JSON.parse(p.slice(i)); } catch {} } }
    return p;

  function errText(e, server) {
    const s = (e && e.server) || server, msg = String((e && e.message) || "").slice(0, 220);
    switch (e && e.code) {

      case "server_not_connected": case "server_not_found": return `${s} isn't connected to your claude.ai account. Add it in Settings → Connectors, then reload.`;
      case "selection_required": return `You have more than one ${s} connector. Pick one when claude.ai asks, then try again.`;
      case "not_in_manifest": return `${s} is turned off for this page. Turn it on from the artifact's Permissions menu.`;
      case "blocked_by_policy": return `Your organization blocks this ${s} tool for your account.`;

      case "rate_limited": return `${s} is rate-limiting requests. Wait a minute and try again.`;
      case "server_unavailable": return `${s} didn't respond. Wait a minute and try again.`;

      default: return `${s} request failed${e && e.code ? ` (${e.code})` : ""}. ${msg}`;

  async function callTool(server, tool, input) {

  }

  // ---------- Salesforce sync ----------
  function soqlRecords(p) { return (p && (p.records || (p.result && p.result.records))) || []; }
  async function soql(q) { return soqlRecords(await callTool(SF, "soqlQuery", { q })); }
  async function syncSalesforce() {
    if (S.sync.running || !canWrite()) return;
    S.sync = { running: true, msg: "Reading open opportunities from Salesforce…", err: "" }; renderAccounts();
    try {
      const ownerIds = Object.values(SF_USERS).map((x) => `'${x}'`).join(",");
      const recs = await soql(`SELECT Id, Name, StageName, Amount, CloseDate, LastActivityDate, OwnerId, Owner.Name, AccountId, Account.Name, Account.Website, (SELECT IsPrimary, ContactId, Contact.Name, Contact.Title, Contact.Email, Contact.Phone FROM OpportunityContactRoles WHERE IsPrimary = true) FROM Opportunity WHERE OwnerId IN (${ownerIds}) AND IsClosed = false AND RecordType.DeveloperName = 'New_Business' ORDER BY CloseDate ASC LIMIT 1000`);
      const byOpp = new Map(), byDomain = new Map(), byName = new Map();
      for (const [id, a] of S.accounts) {
        if (a.sf_opportunity_id) byOpp.set(a.sf_opportunity_id, id);
        else { if (a.domain) byDomain.set(normDomain(a.domain), id); if (a.company_name) byName.set(normName(a.company_name), id); }
      }
      const ownerFor = (oid) => Object.keys(SF_USERS).find((k) => SF_USERS[k] === oid) || "Jeremy";
      let created = 0, updated = 0, converted = 0; const seen = new Set(); const jobs = [];
      for (const r of recs) {
        seen.add(r.Id);
        const acc = r.Account || {}; const dom = normDomain(acc.Website);
        const sfFields = {
          sf_opportunity_id: r.Id, sf_opportunity_name: r.Name || "", sf_account_id: r.AccountId || null,
          stage: r.StageName || "", amount: r.Amount == null ? null : Number(r.Amount), close_date: r.CloseDate || null,
          sf_owner: (r.Owner && r.Owner.Name) || "", last_activity_date: r.LastActivityDate || null, sf_closed: false,
          sf_synced_at: nowIso(), band: "deal", sf_excluded: false, sf_record_type: "New Business",
        };
        const role = r.OpportunityContactRoles && r.OpportunityContactRoles.records && r.OpportunityContactRoles.records[0];
        const pc = role && role.Contact ? { sf_contact_id: role.ContactId, name: role.Contact.Name || "", title: role.Contact.Title || "", email: role.Contact.Email || "", phone: role.Contact.Phone || "", source: "salesforce" } : null;
        let id = byOpp.get(r.Id), mode = "update";
        if (!id) { id = (dom && byDomain.get(dom)) || byName.get(normName(acc.Name)); mode = id ? "convert" : "create"; }
        if (mode === "convert") { byDomain.delete(dom); byName.delete(normName(acc.Name)); }
        if (mode === "create") {
          id = rid("a");
          const contacts = pc ? [{ id: rid("c"), ...pc, is_primary: true, status: "Connected" }] : [];
          jobs.push(() => acctRef(id).set({ ...sfFields, owner: ownerFor(r.OwnerId), company_name: acc.Name || r.Name, domain: dom, contacts, created_at: nowIso(), updated_at: nowIso() }));
          created++;
        } else {
          const a = S.accounts.get(id) || {}; const patch = { ...sfFields, updated_at: nowIso() };
          if (mode === "convert") { patch.owner = ownerFor(r.OwnerId); patch.outbound_stage = a.stage || ""; patch.origin = a.source === "inbound" ? "inbound" : "outbound"; patch.converted_at = nowIso(); converted++; const oppName = r.Name || ""; const cid0 = id; jobs.push(() => logActivity(cid0, { type: "system", summary: `Became an active deal: ${oppName} (Salesforce sync)` })); } else updated++;
          if (!a.domain && dom) patch.domain = dom;
          if (pc) {
            const cs = Array.isArray(a.contacts) ? a.contacts.slice() : [];
            const hit = cs.find((c) => (c.sf_contact_id && c.sf_contact_id === pc.sf_contact_id) || (pc.email && c.email && c.email.toLowerCase() === pc.email.toLowerCase()));
            if (!hit) { cs.push({ id: rid("c"), ...pc, is_primary: !cs.some((c) => c.is_primary), status: "Connected" }); patch.contacts = cs; }
            else if (!hit.sf_contact_id) { patch.contacts = cs.map((c) => (c === hit ? { ...c, sf_contact_id: pc.sf_contact_id } : c)); }
          }

      if (gone.length) {

          const chunk = gone.slice(i, i + 100);
          const cr = await soql(`SELECT Id, StageName, IsClosed, RecordType.Name, RecordType.DeveloperName, Amount, CloseDate, LastActivityDate, Owner.Name FROM Opportunity WHERE Id IN (${chunk.map(([, a]) => `'${a.sf_opportunity_id}'`).join(",")})`);
          for (const r of cr) {
            const hit = chunk.find(([, a]) => a.sf_opportunity_id === r.Id); if (!hit) continue;
            const rt = r.RecordType || {};
            if (!r.IsClosed && rt.DeveloperName && rt.DeveloperName !== "New_Business") { excluded++; jobs.push(() => acctRef(hit[0]).update({ sf_excluded: true, sf_record_type: rt.Name || rt.DeveloperName, sf_synced_at: nowIso() })); continue; }
            closed += r.IsClosed ? 1 : 0;
            jobs.push(() => acctRef(hit[0]).update({ stage: r.StageName || "", sf_closed: !!r.IsClosed, amount: r.Amount == null ? null : Number(r.Amount), close_date: r.CloseDate || null, last_activity_date: r.LastActivityDate || null, sf_owner: (r.Owner && r.Owner.Name) || "", sf_synced_at: nowIso(), updated_at: nowIso() }));
          }
        }

      S.sync.msg = `Saving ${jobs.length} accounts…`; renderAccounts();
      let failed = 0;

  // ---------- Gong ----------

  async function pullGong(id) {

      const win = { fromDateTime: from.toISOString(), toDateTime: to.toISOString() };
      const [ctx, steps] = await Promise.all([
        callTool(GONG, tool, { ...base, ...win, question: "Summarize where this stands from recent calls and emails: what the buyer cares about, open concerns, and the last commitments each side made." }),
        callTool(GONG, tool, { ...base, ...win, question: "What specific next steps should the TextUs rep take now? List each as one short action starting with a verb." }),

      logActivity(id, { type: "system", summary: `Pulled Gong context (${calls} calls, ${emails} emails)` });

    } catch (e) {

      S.gong = { running: false, err: errText(e, GONG) };
    }
    renderDetail();
  }
  async function resolveSuggestion(accId, sid, accept) {

  // ---------- routing ----------
  const VIEWS = ["today", "accounts", "account", "prospect", "email", "mqls", "signals", "dash"];
  const kindOf = (a) => (a && a.band === "deal" ? "deal" : "outbound");
  const listHash = (a) => (kindOf(a) === "deal" ? "#deals" : "#targets");
  function parseHash() {
    const h = location.hash.replace(/^#/, "");
    if (h === "deals" || h === "accounts") return { view: "deals", id: null };
    if (h === "targets") return { view: "targets", id: null };
    if (h === "prospect") return { view: "prospect", id: null };
    if (h === "email") return { view: "email", id: null };
    if (h === "mqls") return { view: "mqls", id: null };
    if (h === "signals") return { view: "signals", id: null };

  }
  const isList = (v) => v === "deals" || v === "targets";
  function navFor(r) {
    if (r.view === "account") { const a = S.accounts.get(r.id); return a ? (kindOf(a) === "deal" ? "deals" : "targets") : null; }

  }

    rows.sort((a, b) => {
      const A = a[1], B = b[1];
      if (A.band === "deal" && B.band === "deal") { if (!!A.sf_closed !== !!B.sf_closed) return A.sf_closed ? 1 : -1; return String(A.close_date || "9999").localeCompare(String(B.close_date || "9999")); }
      if (S.seg === "outbound" && S.af.sort === "stale") return String(A.last_touch_at || "").localeCompare(String(B.last_touch_at || "")) || String(A.company_name || "").localeCompare(String(B.company_name || ""));
      if (S.seg === "outbound") return String(B.created_at || "").localeCompare(String(A.created_at || ""));
      return String(A.company_name || "").localeCompare(String(B.company_name || ""));
    });
    const last = S.settings.last_sf_sync;
    const syncLine = S.sync.err ? `<span class="sync-line err">${esc(S.sync.err)}</span>` : S.sync.running ? `<span class="sync-line"><span class="spinner"></span> ${esc(S.sync.msg)}</span>` : S.sync.msg ? `<span class="sync-line">${esc(S.sync.msg)}</span>` : last ? `<span class="sync-line">Salesforce synced ${esc(fmtWhen(last.at))}${last.by ? ` by ${esc(last.by)}` : ""}</span>` : `<span class="sync-line">Salesforce not synced yet</span>`;
    const ownerCell = (a) => `<td><span class="owner-dot" title="${esc(a.owner)}">${esc(initial(a.owner))}</span> <span class="small">${esc(a.owner || "")}</span></td>`;
    const taskCell = (id) => { const n = open.get(id) || 0; return `<td><span class="taskcount num">${overdue.has(id) ? '<span class="od" title="Has overdue tasks"></span>' : ""}${n || '<span class="muted">0</span>'}</span></td>`; };
    const stagePill = (a) => { const isDeal = a.band === "deal"; return `<span class="pill ${isDeal ? (a.sf_closed ? "warn" : "deal") : "tgt"}">${esc(a.stage || (isDeal ? "Deal" : "Target"))}</span>${a.incomplete && !isDeal ? ' <span class="chip warn" title="Fewer than 3 contacts with an email and a callable number">Incomplete</span>' : ""}`; };
    let head, body;
    const liOn = S.seg === "outbound" && S.af.li !== "any";
    const coCell = (id, a, sub) => { const open = S.expanded.has(id) || liOn; const n = (a.contacts || []).length;
      return `<td><div class="co-cell"><button class="exp" type="button" data-act="toggle-row" data-id="${esc(id)}" aria-expanded="${open}" aria-label="${open ? "Hide" : "Show"} contacts for ${esc(a.company_name)}" title="${n} contact${n === 1 ? "" : "s"}">${ic("chev")}</button>
        <div style="min-width:0"><div class="co">${esc(a.company_name || "Untitled")}</div><div class="dom">${esc(sub)}</div></div></div></td>`; };
    const xrow = (id, a, cols) => S.expanded.has(id) || liOn ? `<tr class="xrow"><td colspan="${cols}">${contactsStrip(id, a, liOn ? (c) => liMatch(c, S.af.li) : null)}</td></tr>` : "";
    if (S.seg === "outbound") {
      head = `<th>Company</th><th>Stage</th><th>Owner</th><th class="r">Contacts</th><th>Open tasks</th><th>Last touch</th><th>Added</th>`;
      body = rows.map(([id, a]) => {
        const cs = Array.isArray(a.contacts) ? a.contacts : []; const li = cs.filter((c) => c.linkedin_sent).length;
        return `<tr data-href="#account-${id}" tabindex="0" class="${S.expanded.has(id) || liOn ? "open" : ""}">
          ${coCell(id, a, [a.sub_industry || a.industry, a.employee_count ? fmtInt(a.employee_count) + " employees" : ""].filter(Boolean).join(" · ") || a.domain || "").replace('<div class="dom">', '<div class="dom">' + (a.source === "inbound" ? '<span class="kind inb" style="font-size:10px;padding:0 6px;margin-right:6px">Inbound</span>' : "") + (a.intent ? '<span class="kind deal" style="font-size:10px;padding:0 6px;margin-right:6px" title="Intent signal">Intent</span>' : ""))}
          <td>${stagePill(a)}</td>${ownerCell(a)}
          <td class="r num">${cs.length}${li ? ` <span class="small muted" title="LinkedIn connects sent">· LI ${li}</span>` : ""}</td>
          ${taskCell(id)}<td>${a.last_touch_at ? `<span class="touch ${daysBetween(localDay(a.last_touch_at), t) > 14 ? "stale" : ""}" title="${esc(fmtWhen(a.last_touch_at))}">${esc(agoLabel(a.last_touch_at))} · ${esc(TOUCH_LABEL[a.last_touch_type] || "Touch")}</span>` : '<span class="touch none">No touches</span>'}</td>
          <td class="num small">${esc(fmtDate(localDay(a.created_at)))}</td></tr>${xrow(id, a, 7)}`;
      }).join("");
    } else {
      head = `<th>Company</th><th>Stage</th><th>Owner</th><th>Open tasks</th><th class="r">Amount</th><th>Close date</th>`;
      body = rows.map(([id, a]) => `<tr data-href="#account-${id}" tabindex="0" class="${S.expanded.has(id) ? "open" : ""}">
          ${coCell(id, a, a.sf_opportunity_name || a.domain || "").replace('<div class="dom">', a.origin === "outbound" ? '<div class="dom"><span class="kind tgt" style="font-size:10px;padding:0 6px;margin-right:6px">Outbound</span>' : a.origin === "inbound" ? '<div class="dom"><span class="kind inb" style="font-size:10px;padding:0 6px;margin-right:6px">Inbound</span>' : '<div class="dom">')}
          <td>${stagePill(a)}</td>${ownerCell(a)}${taskCell(id)}
          <td class="r num">${money(a.amount)}</td><td class="num">${esc(fmtDate(a.close_date))}</td></tr>${xrow(id, a, 6)}`).join("");
    }
    const loading = S.db && !S.loaded.a;
    const emptyMsg = loading ? `<div class="empty"><span class="spinner"></span><span>Loading…</span></div>`
      : !segTotal ? (S.seg === "deal" ? `<div class="empty"><span class="bubble">No active deals yet.</span><span class="small">Click Sync Salesforce to bring in open opportunities.</span></div>` : `<div class="empty"><span class="bubble">No target accounts yet.</span><span class="small">Use <a href="#prospect">Find targets</a> to pull companies and contacts from ZoomInfo.</span></div>`)
      : `<div class="empty"><span>Nothing matches these filters.</span></div>`;
    $("acc-sync").innerHTML = S.seg === "deal" ? `${syncLine}
          <button class="btn sec" type="button" data-act="sync" ${!canWrite() || S.sync.running || !S.mcp ? "disabled" : ""} title="${S.mcp ? "Pull open opportunities owned by Jeremy and David" : "Open in claude.ai to use Salesforce"}">${ic("sync")} Sync Salesforce</button>`
      : `<a class="btn ghost" href="#email">${ic("gear")} Settings</a>`;
    $("add-account-panel").hidden = !(S.addAccount && S.seg === "outbound");
    renderAccHero(all, open, overdue);
    renderAccFilters();
    const note = $("acc-note");
    if (note) {
      const noun = (n) => S.seg === "deal" ? (n === 1 ? "deal" : "deals") : (n === 1 ? "target" : "targets");
      let txt = rows.length === segTotal ? `${rows.length} ${noun(rows.length)}` : `${rows.length} of ${segTotal} ${noun(segTotal)}`;
      if (S.seg === "deal" && rows.length) { const sum = rows.reduce((s, [, a]) => s + (Number(a.amount) || 0), 0); txt += ` · ${money(sum)}`; }
      note.textContent = txt;
    }
    $("acc-table").innerHTML = rows.length ? `<div class="table-wrap"><table class="book ${S.seg === "deal" ? "k-deal" : "k-tgt"}"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>` : emptyMsg;
  }

  function contactsStrip(accId, a, only) {
    const cs = (Array.isArray(a.contacts) ? a.contacts : []).filter((c) => !only || only(c)).slice().sort((x, y) => (y.id === a.champion_id ? 1 : 0) - (x.id === a.champion_id ? 1 : 0) || (y.is_primary ? 1 : 0) - (x.is_primary ? 1 : 0) || (x.persona_tier || 9) - (y.persona_tier || 9));
    const ro = canWrite() ? "" : "disabled";
    const phone = (v, dnc, k, c) => (v ? `<div class="cline"><span class="k">${k}</span>${callLink(v, dnc, accId, c)}${dnc ? '<span class="chip bad" title="ZoomInfo marks this number do-not-call">DNC</span>' : ""}${copyBtn(v, k + " phone")}</div>` : "");
    const cards = cs.map((c) => {
      const st = cStatus(c.status);
      const liSearch = `https://www.linkedin.com/search/results/people/?keywords=${encodeURIComponent([c.name, a.company_name].filter(Boolean).join(" "))}`;
      return `<div class="contact ${c.is_primary ? "primary" : ""}">
        <div class="contact-top"><div class="nm"><b>${esc(c.name || "Unnamed")}</b>${c.title ? `<span>${esc(c.title)}</span>` : ""}</div>${c.id === a.champion_id ? `<span class="champ-chip">${ic("champ")} Champion</span>` : canWrite() ? `<button class="champ-btn" type="button" data-act="champion" data-acc="${esc(accId)}" data-id="${esc(c.id)}">${ic("champ")} Make champion</button>` : ""}</div>
        <div class="flags">${c.persona_tier ? `<span class="tier t${esc(c.persona_tier)}">${esc(TIER_LABEL[c.persona_tier] || "")}</span>` : ""}${c.is_primary ? '<span class="chip">Primary</span>' : ""}
          ${c.linkedin_url ? `<a class="chip" href="${esc(c.linkedin_url)}" target="_blank" rel="noopener">LinkedIn ↗</a>` : `<a class="chip" href="${esc(liSearch)}" target="_blank" rel="noopener">Find on LinkedIn ↗</a>`}${confFlags(c.zi_accuracy, c.zi_updated)}</div>
        ${c.email || c.phone || c.mobile ? `<div class="lines" style="gap:4px">${c.email ? `<div class="cline"><span class="k">Email</span><span class="v">${esc(c.email)}</span>${copyBtn(c.email, "email")}</div>` : ""}${phone(c.phone, c.phone_dnc, "Direct", c)}${phone(c.mobile, c.mobile_dnc, "Mobile", c)}</div>` : ""}
        <div class="foot"><label class="sr" for="xs-${esc(accId)}-${esc(c.id)}">Status</label><select class="sel small" id="xs-${esc(accId)}-${esc(c.id)}" data-act-change="contact-status" data-acc="${esc(accId)}" data-id="${esc(c.id)}" style="padding:3px 8px" ${ro}>${CONTACT_STATUS.map((s) => `<option ${s === st ? "selected" : ""}>${s}</option>`).join("")}</select>
          ${liControls(accId, a, c)}${canWrite() ? emailBtn(accId, c) : ""}${logCallBtn(accId, c)}${lastEmailed(c)}</div></div>`;
    }).join("");
    return `${cs.length ? `<div class="xcontacts">${cards}</div>` : `<div class="small muted" style="padding-top:6px">No contacts yet.</div>`}
      <div class="xmore"><a href="#account-${esc(accId)}">Open account: tasks, notes${a.band === "deal" ? ", Gong" : ""} →</a>${a.band !== "deal" && cs.length ? '<span>Sourced contacts: call only. Don\'t text until they opt in.</span>' : ""}</div>`;
  }

  // ---------- Account detail ----------
  function buildDetailShell() {
    $("view-account").innerHTML = `<div style="display:grid;gap:16px">
      <a class="back" href="#deals" id="d-back">${ic("back")} Active Deals</a>
      <div id="d-head"></div>
      <div class="detail-grid">
        <div class="col">
          <div class="panel" id="d-tasks-panel">
            <div class="panel-head"><h2>Tasks</h2><span class="small muted" id="d-task-count"></span></div>
            <div class="panel-body">
              <form class="row-form" id="task-form">
                <label class="sr" for="nt-title">New task</label><input class="field grow" id="nt-title" placeholder="Add a task, e.g. Call about pilot pricing" autocomplete="off">
                <label class="sr" for="nt-due">Due date</label><input class="field" id="nt-due" type="date" value="${today()}">
                <label class="sr" for="nt-contact">Contact</label><select class="sel" id="nt-contact"></select>
                <button class="btn" type="submit">${ic("plus")} Add</button>
              </form>
              <div id="d-sugg"></div>
            </div>
            <div id="d-tasks"></div>
          </div>
          <div class="panel">
            <div class="panel-head"><h2>Activity</h2><div class="row-form"><button class="btn ghost sm-btn" type="button" data-act="log-call-acct">${ic("phone")} Log call</button></div></div>
            <div class="panel-body">
              <form id="note-form" style="display:grid;gap:8px">
                <label class="sr" for="nn-body">New note</label><textarea class="field" id="nn-body" placeholder="Add a note: what happened, what you learned"></textarea>
                <div><button class="btn sec" type="submit">Add note</button></div>
              </form>
              <div class="tabs tl-filters" role="group" aria-label="Activity type" id="d-tl-filters"></div>
              <div id="d-timeline"></div>
            </div>
          </div>
        </div>
        <div class="col">
          <div class="panel">
            <div class="panel-head"><h2>Contacts</h2><div style="display:flex;gap:2px;flex-wrap:wrap"><button class="btn ghost" type="button" data-act="zi-more" title="Search ZoomInfo for more contacts at this company">${ic("search")} ZoomInfo</button><button class="btn ghost" type="button" data-act="add-contact">${ic("plus")} Add</button></div></div>
            <div class="panel-body" id="d-contacts"></div>
          </div>
          <div class="panel" id="d-gong"></div>
          <div class="danger-zone" id="d-danger"></div>
        </div>
      </div>
    </div>`;
  }
  function renderDetail() {
    if (S.route.view !== "account") return;
    if (!$("d-head")) buildDetailShell();
    const id = S.route.id; const a = S.accounts.get(id);
    if (!a) {
      $("d-head").innerHTML = S.loaded.a ? `<div class="empty"><span class="bubble">This account isn't on the board.</span><span class="small">It may have been deleted. <a href="#deals">Active Deals</a> · <a href="#targets">Target Accounts</a></span></div>` : `<div class="empty"><span class="spinner"></span><span>Loading account…</span></div>`;
      ["d-tasks", "d-sugg", "d-contacts", "d-gong", "d-danger"].forEach((k) => ($(k).innerHTML = ""));
      return;
    }
    const isDeal = a.band === "deal";
    const back = $("d-back"); if (back) { back.href = listHash(a); back.innerHTML = `${ic("back")} ${isDeal ? "Active Deals" : "Target Accounts"}`; }
    showView(S.route);
    const sfUrl = a.sf_opportunity_id ? `${SF_BASE}/lightning/r/Opportunity/${encodeURIComponent(a.sf_opportunity_id)}/view` : "";
    const openN = openTasks().filter(([, x]) => x.account_id === id).length;
    const ch = championOf(a);
    const lastTouch = a.last_touch_at ? `${agoLabel(a.last_touch_at)} · ${TOUCH_LABEL[a.last_touch_type] || ""}` : "None yet";
    const facts = isDeal
      ? [["Amount", money(a.amount)], ["Close date", fmtDate(a.close_date)], ["SF owner", a.sf_owner || "—"], ["Last SF activity", fmtDate(a.last_activity_date)], ["Last touch", lastTouch], ["Open tasks", String(openN)]]
      : [["Industry", a.sub_industry || a.industry || "—"], ["Employees", a.employee_count ? fmtInt(a.employee_count) : "—"], ["Contacts", String((a.contacts || []).length)], ["Added", fmtDate(localDay(a.created_at))], ["Last touch", lastTouch], ["Open tasks", String(openN)]];
    const ro = canWrite() ? "" : "disabled";
    $("d-head").innerHTML = `<div class="upnext acct-hero"><div class="un-main">
        <div class="un-lab" style="display:flex;flex-wrap:wrap;gap:6px;align-items:center">${isDeal ? '<span class="kind deal">Active deal</span>' : '<span class="kind tgt">Target account</span>'}${isDeal && a.origin === "outbound" ? '<span class="kind tgt" title="Started as an outbound target">Outbound-sourced</span>' : ""}${a.source === "inbound" ? '<span class="kind inb" title="Came in as a HubSpot MQL">Inbound</span>' : ""}${a.intent ? `<span class="chip" title="ZoomInfo intent signal">Intent · ${esc((a.intent.topics || []).join(", "))} · ${esc(fmtDate((a.intent.last || "").slice(0, 10)))}</span>` : ""}${a.multi_site ? '<span class="chip">Multi-site</span>' : ""}${a.incomplete && !isDeal ? '<span class="chip warn" title="Fewer than 3 contacts with an email and a callable number">Incomplete</span>' : ""}</div>
        <h1>${esc(a.company_name || "Untitled")}</h1>
        <div class="un-sub">${isDeal && a.sf_opportunity_name ? esc(a.sf_opportunity_name) + (a.domain ? " · " : "") : ""}${a.domain ? `<a href="https://${esc(normDomain(a.domain))}" target="_blank" rel="noopener">${esc(normDomain(a.domain))}</a>` : ""}</div>
        <div class="hero-fields">
          <label>Stage${isDeal ? `<span class="v-static">${esc(a.stage || "—")}${a.sf_closed ? " · Closed" : ""}</span>` : `<select class="sel" id="f-stage" data-act-change="stage" ${ro}>${OUT_STAGES.map((s) => `<option ${s === a.stage ? "selected" : ""}>${s}</option>`).join("")}${a.stage && !OUT_STAGES.includes(a.stage) ? `<option selected>${esc(a.stage)}</option>` : ""}</select>`}</label>
          <label>Champion<select class="sel" id="f-champion" data-act-change="champion" ${canWrite() && (a.contacts || []).length ? "" : "disabled"} title="Default contact for this account's tasks"><option value="">${(a.contacts || []).length ? "Not set" : "Add a contact first"}</option>${(a.contacts || []).map((c) => `<option value="${esc(c.id)}" ${c.id === a.champion_id ? "selected" : ""}>${esc(c.name || "Unnamed")}</option>`).join("")}</select></label>
          <label>Owner<select class="sel" id="f-owner" data-act-change="owner" ${ro}>${OWNERS.map((o) => `<option ${o === a.owner ? "selected" : ""}>${o}</option>`).join("")}</select></label>
        </div>
        <div class="un-actions">
          ${sfUrl ? `<a class="btn un-btn" href="${esc(sfUrl)}" target="_blank" rel="noopener">${ic("out")} Open in Salesforce</a>` : ""}
          ${!isDeal && canWrite() ? `<button class="btn un-btn" type="button" data-act="book-meeting">${ic("champ")} Meeting booked</button>` : ""}
          ${canWrite() ? `<button class="btn un-btn ghosty" type="button" data-act="log-call-acct">${ic("phone")} Log call</button>` : ""}
          ${ch && canEmail(ch) && canWrite() ? `<button class="btn un-btn ghosty" type="button" data-act="email" data-acc="${esc(id)}" data-id="${esc(ch.id)}">${ic("mail")} Email ${esc(ch.name.split(" ")[0])}</button>` : ""}
        </div></div>
      <div class="un-prep"><dl class="un-facts">${facts.map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>
        ${isDeal ? `<div class="un-foot">Deal fields come from Salesforce${a.sf_synced_at ? `, synced ${esc(fmtWhen(a.sf_synced_at))}` : ""}. Change them there.</div>` : ""}</div></div>`;
    renderDetailTasks(a); renderContacts(a); renderGong(a); renderNotes();
    $("d-danger").innerHTML = canWrite() ? (S.confirmDelete ? `<span class="small">Delete ${esc(a.company_name)} with its tasks and notes?</span><button class="btn danger" type="button" data-act="delete-account-yes">${ic("trash")} Delete for good</button><button class="btn ghost" type="button" data-act="delete-account-no">Keep it</button>` : `<button class="btn ghost" type="button" data-act="delete-account">${ic("trash")} Delete account</button>`) : "";
  }
  function contactOptions(a, sel) {
    const cs = Array.isArray(a.contacts) ? a.contacts : [];
    const ch = championOf(a); sel = sel || "";
    return `<option value="" ${sel === "" ? "selected" : ""}>${ch ? `Champion: ${esc(ch.name)}` : "Champion (not set)"}</option><option value="none" ${sel === "none" ? "selected" : ""}>No contact</option>` + cs.map((c) => `<option value="${esc(c.id)}" ${c.id === sel ? "selected" : ""}>${esc(c.name || "Unnamed")}${c.id === (a.champion_id || "") ? " (champion)" : ""}</option>`).join("");
  }
  function renderDetailTasks(a) {
    const id = S.route.id; const ct = $("nt-contact");
    if (ct && document.activeElement !== ct) { const v = ct.value; ct.innerHTML = contactOptions(a, v); }
    const list = $("d-tasks");
    if (S.editTask && list.contains(document.activeElement)) return;
    const mine = [...S.tasks.entries()].filter(([, x]) => x.account_id === id);
    const open = mine.filter(([, x]) => x.status !== "done").sort((x, y) => String(x[1].due_date || "9999").localeCompare(String(y[1].due_date || "9999")));
    const done = mine.filter(([, x]) => x.status === "done").sort((x, y) => String(y[1].completed_at || "").localeCompare(String(x[1].completed_at || "")));
    $("d-task-count").textContent = `${open.length} open · ${done.length} done`;
    const row = ([tid, x], isDone) => {
      const tc = taskContact(a, x); const dl = dueLabel(x.due_date);
      if (S.editTask === tid) return `<li><form class="edit-row" data-form="edit-task" data-id="${tid}">
          <input class="field" name="title" value="${esc(x.title)}" aria-label="Task title">
          <input class="field" name="due" type="date" value="${esc(x.due_date || "")}" style="flex:0 1 150px" aria-label="Due date">
          <select class="sel" name="contact" aria-label="Contact">${contactOptions(a, x.contact_id)}</select>
          <button class="btn" type="submit">Save</button><button class="btn ghost" type="button" data-act="cancel-edit-task">Cancel</button></form></li>`;
      return `<li class="${isDone ? "done" : ""}"><input type="checkbox" class="chk" data-act="${isDone ? "undone" : "done"}" data-id="${tid}" ${isDone ? "checked" : ""} aria-label="${isDone ? "Reopen" : "Mark done"}: ${esc(x.title)}">
        <div class="t-main"><span class="t-title">${esc(x.title)}</span>
          <span class="t-meta">${contactTag(tc)}${x.source === "gong-suggested" ? '<span class="pill gong">Gong</span>' : ""}${isDone && x.completed_at ? `<span>Done ${esc(fmtWhen(x.completed_at))}</span>` : ""}</span></div>
        <div class="t-side">${isDone ? "" : `<span class="pill ${dl.cls}">${esc(dl.txt)}</span>`}
          ${canWrite() ? `${isDone ? "" : `<button class="icon-btn" type="button" data-act="edit-task" data-id="${tid}" aria-label="Edit task">${ic("edit")}</button>`}<button class="icon-btn" type="button" data-act="delete-task" data-id="${tid}" aria-label="Delete task">${ic("trash")}</button>` : ""}</div></li>`;
    };
    list.innerHTML = (open.length ? `<ul class="tasklist" style="border-top:1px solid var(--line)">${open.map((r) => row(r, false)).join("")}</ul>` : `<div class="empty small" style="border-top:1px solid var(--line)">No open tasks. Add the next step above.</div>`)
      + (done.length ? `<details class="done-box" ${S.showDone ? "open" : ""}><summary>Done (${done.length})</summary><ul class="tasklist">${done.map((r) => row(r, true)).join("")}</ul></details>` : "");
    const det = list.querySelector("details"); if (det) det.addEventListener("toggle", () => (S.showDone = det.open));
    const sug = (a.gong && Array.isArray(a.gong.suggestions) ? a.gong.suggestions : []).filter((s) => s.status === "pending");
    $("d-sugg").innerHTML = sug.length ? `<div class="sugg"><div class="eyebrow" style="color:var(--gong)">Suggested by Gong · ${sug.length}</div>
      ${sug.map((s) => `<div class="sugg-item"><p>${esc(s.text)}</p><div class="acts">
        <button class="btn gong" type="button" data-act="accept-sugg" data-id="${esc(s.id)}" ${canWrite() ? "" : "disabled"}>${ic("check")} Add task</button>

    const iName = pickCol(head, [/^company( name)?$/, /^account( name)?$/, /^company/, /^name$/]);
    const iSub = pickCol(head, [/^sub ?industry$/, /sub ?industry/, /^industry$/, /industry/]);

      if (onBoard.has(key)) { skipped.push({ name, why: "already an account" }); return; }

  // ---------- Activity history ----------
  const CALL_OUTCOMES = ["Connected", "Left voicemail", "No answer", "Wrong number"];

  const TL_FILTERS = [["all", "All"], ["note", "Notes"], ["email", "Emails"], ["call", "Calls"], ["meeting", "Meetings"], ["task", "Tasks"], ["update", "Updates"]];
  const digitsOf = (v) => String(v || "").split(/\s*(?:ext\.?|x|#)\s*\d+\s*$/i)[0].replace(/\D/g, "").replace(/^1(?=\d{10}$)/, "");
  function logActivity(accId, d) {
    if (!S.db || !canWrite() || !accId) return Promise.resolve();
    const doc = { account_id: accId, at: nowIso(), by: S.myOwner || S.meName || "Someone", by_id: S.meId || null, ...d };
    const p = S.db.collection("activity").doc(rid("ev")).set(doc).catch((e) => console.error("activity", e));
    if (OUTREACH.has(d.type)) acctRef(accId).update({ last_touch_at: doc.at, last_touch_type: d.type }).catch(() => {});
    return p;
  }
  function agoLabel(iso) {
    if (!iso) return "";
    const d = daysBetween(localDay(iso), today());
    return d <= 0 ? "Today" : d === 1 ? "Yesterday" : d < 7 ? `${d}d ago` : d < 60 ? `${Math.round(d / 7)}w ago` : `${Math.round(d / 30)}mo ago`;
  }
  const TOUCH_LABEL = { email: "Email", call: "Call", linkedin: "LinkedIn", meeting: "Meeting" };
  function timelineItems(accId) {
    const out = [];
    for (const [id, n] of S.notes) out.push({ id, src: "note", type: n.kind === "email" ? "email" : "note", at: n.created_at, by: n.author, summary: n.kind === "email" ? n.body : "", body: n.kind === "email" ? "" : n.body });
    for (const [id, x] of S.acts) out.push({ id, src: "act", type: x.type, at: x.at, by: x.by, summary: x.summary, body: x.body || "", outcome: x.outcome, contact: x.contact_name });
    for (const [id, t] of S.tasks) if (t.account_id === accId && t.status === "done" && t.completed_at) out.push({ id, src: "task", type: "task", at: t.completed_at, by: t.completed_by || "", summary: `Completed: ${t.title}` });
    return out.sort((a, b) => String(b.at || "").localeCompare(String(a.at || "")));
  }
  const tlGroup = (t) => (["note", "email", "call", "meeting", "task"].includes(t) ? t : "update");

  function renderTimeline() {

  // ---------- Call log and meeting booking ----------
  const bestNumber = (c) => (!c ? "" : c.phone && !c.phone_dnc ? c.phone : c.mobile && !c.mobile_dnc ? c.mobile : c.phone || c.mobile || "");

  function openCallLog(accId, cid, number, mode) {

    S.callLog = { hsOn: true, mode: mode || "call", accId, cid: c ? c.id : "", number: number || bestNumber(c), outcome: mode === "meeting" ? "Connected" : "", note: "", meeting: mode === "meeting", mdate: addDays(today(), 2), follow: true, followDays: 2, markWrong: true, busy: false, err: "" };

  async function prepCallHs() {

  }
  function closeCallLog() { S.callLog = null; const el = $("calllog"); el.hidden = true; el.innerHTML = ""; document.body.style.overflow = ""; }
  function readCallLog() {

    if (ck("cl-wrong") !== undefined) L.markWrong = ck("cl-wrong");
    if (ck("cl-hs") !== undefined) L.hsOn = ck("cl-hs");
  }
  function renderCallLog(full) {
    const L = S.callLog; const el = $("calllog"); if (!L) { el.hidden = true; return; }
    const a = S.accounts.get(L.accId) || {}; const cs = a.contacts || []; const c = contactOf(a, L.cid);
    const isMeet = L.mode === "meeting";
    const nums = c ? [c.phone && [c.phone_dnc ? "Direct (do not call)" : "Direct", c.phone], c.mobile && [c.mobile_dnc ? "Mobile (do not call)" : "Mobile", c.mobile]].filter(Boolean) : [];
    el.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="cl-h" style="max-width:560px">
      <div class="sheet-head"><div><div class="eyebrow">${a.band === "deal" ? '<span class="kind deal">Deal</span>' : '<span class="kind tgt">Target</span>'} ${esc(a.company_name || "")}</div><h2 id="cl-h" style="font-size:20px">${isMeet ? "Meeting booked" : "Log a call"}</h2></div>
        <button class="icon-btn" type="button" data-act="cl-close" aria-label="Close">${ic("x")}</button></div>
      <form class="sheet-body" id="cl-form">
        <label class="lbl" for="cl-contact">${isMeet ? "Meeting with" : "Who you called"}<select class="sel" id="cl-contact">${cs.map((x) => `<option value="${esc(x.id)}" ${x.id === L.cid ? "selected" : ""}>${esc(x.name || "Unnamed")}${x.title ? " · " + esc(x.title) : ""}</option>`).join("")}${cs.length ? "" : '<option value="">No contacts on this account</option>'}</select></label>
        ${!isMeet && nums.length > 1 ? `<label class="lbl" for="cl-number">Number<select class="sel" id="cl-number">${nums.map(([k, n]) => `<option value="${esc(n)}" ${n === L.number ? "selected" : ""}>${k}: ${esc(n)}</option>`).join("")}</select></label>` : ""}
        ${isMeet ? "" : `<fieldset class="outcomes"><legend class="lbl">Outcome</legend>${CALL_OUTCOMES.map((o) => `<label class="outcome"><input type="radio" name="cl-outcome" value="${o}" ${L.outcome === o ? "checked" : ""}><span>${o}</span></label>`).join("")}</fieldset>`}
        ${!isMeet && L.outcome === "Connected" ? `<label class="switch"><input type="checkbox" id="cl-meeting" ${L.meeting ? "checked" : ""}> Booked a meeting</label>` : ""}
        ${L.meeting ? `<label class="lbl" for="cl-mdate">Meeting date<input class="field" type="date" id="cl-mdate" value="${esc(L.mdate)}" style="max-width:200px"></label>

  async function saveCallLog() {

    if (L.meeting && !L.mdate) { L.err = "Pick the meeting date."; renderCallLog(); return; }
    L.busy = true; L.err = ""; renderCallLog();
    const name = c ? c.name : "";
    const ts = nowIso();
    if (!isMeet) await logActivity(L.accId, { type: "call", outcome: L.outcome, contact_id: c ? c.id : null, contact_name: name, number: L.number || "", body: L.note.trim(), summary: `${L.outcome}${name ? " · " + name : ""}` });

  function mqlEvent(e) {
    const s = String(e || "");

  function mqlFlags(r) {
    const d = (r.domain || "").toLowerCase(); const name = `${r.first || ""} ${r.last || ""}`.trim();
    const junk = [];
    if (PERSONAL.test(d)) junk.push("Personal email");
    if (/^(student|s|u|my)\./.test(d) || /\.edu$/.test(d) && /student|^s\.|^u\./.test(d)) junk.push("Student email");
    if (d === "textus.com") junk.push("Internal");
    if (/^\d+\.com$/.test(d) || /\.(xyz|top|click)$/.test(d)) junk.push("Fake domain");
    if (/(.)\1{3,}|^[^aeiou\s]{5,}$/i.test(name) || /sdf|asdf|qwer/i.test(name)) junk.push("Fake name");
    if (/seo|backlink|link building|search engine optimization/i.test(`${r.title} ${r.company}`)) junk.push("Vendor pitch");

    }
    if (el.id === "cp-follow" || el.id === "cp-days") { readCompose(); return; }
    if (el.id === "df-period" || el.id === "df-scope") { S.dashF[el.id === "df-period" ? "period" : "scope"] = el.value; storeJ.set("dashF", S.dashF); renderDash(); return; }
    const mfMap = { "mf-show": "show", "mf-days": "days", "mf-junk": "junk", "mf-sort": "sort" };
    if (mfMap[el.id]) { S.mqlF[mfMap[el.id]] = el.value; storeJ.set("mqlF", S.mqlF); renderMqls(); return; }
    const sfMap = { "sf-show": "show", "sf-days": "days", "sf-size": "size", "sf-topic": "topic" };
    if (sfMap[el.id]) { S.sigF[sfMap[el.id]] = el.value; storeJ.set("sigF", S.sigF); renderSignals(); return; }
    const odMap = { "od-status": "status", "od-sub": "sub", "od-list": "list" };
    if (odMap[el.id]) { S.odF[odMap[el.id]] = el.value; storeJ.set("odF", S.odF); renderOndeck(); return; }
    if (el.id === "od-all") { const byName = accountsByName(); for (const { id, st } of odVisible(byName)) if (st.key !== "added") el.checked ? S.odSel.add(id) : S.odSel.delete(id); renderOndeck(); return; }
    if (el.dataset && el.dataset.odPick) { el.checked ? S.odSel.add(el.dataset.odPick) : S.odSel.delete(el.dataset.odPick); renderOndeck(); return; }
    if (el.id === "in-owner") { store.set("prospectOwner", el.value); return; }
    if (el.id === "od-file") {
      const f = el.files && el.files[0]; if (!f) return;
      if (f.size > 5 * 1024 * 1024) { S.odPreview = { error: "That file is over 5 MB. Export just the target list as CSV." }; renderOdPreview(); return; }
      let text = ""; try { text = await f.text(); } catch { S.odPreview = { error: "The file couldn't be read." }; renderOdPreview(); return; }
      if (!/\.csv$/i.test(f.name) && !/,/.test(text.split(/\r?\n/)[0] || "")) { S.odPreview = { error: "Save the spreadsheet as CSV and import that." }; renderOdPreview(); return; }
      S.odPreview = readTargetCsv(text, f.name); renderOdPreview(); return;
    }
    const jc = el.dataset && el.dataset.jobChange;
    if (jc) {
      const job = S.jobs.find((j) => j.key === el.dataset.job); if (!job) return;
      if (jc === "multi") { job.multi = el.checked; if (job.state === "review") preselect(job); }
      else if (jc === "cand") { if (el.checked) { if (job.selected.size < targetN(job)) job.selected.add(el.dataset.id); } else job.selected.delete(el.dataset.id); job.confirming = false; }
      else if (jc === "task") job.addTask = el.checked;
      renderJobs(); return;
    }
    const act = el.dataset && el.dataset.actChange; if (!act) return;
    const accId = el.dataset.acc || S.route.id; const a = S.accounts.get(accId); if (!a) return;
    if (act === "stage" && await w(() => acctRef(accId).update({ stage: el.value, updated_at: nowIso() }))) logActivity(accId, { type: "change", field: "stage", from: a.stage || "", to: el.value, summary: `Stage: ${a.stage || "—"} → ${el.value}` });
    if (act === "owner" && await w(() => acctRef(accId).update({ owner: el.value, updated_at: nowIso() }))) logActivity(accId, { type: "change", summary: `Owner: ${a.owner || "—"} → ${el.value}` });
    if (act === "champion" && await w(() => acctRef(accId).update({ champion_id: el.value || null, updated_at: nowIso() }))) { const ch = contactOf(a, el.value); logActivity(accId, { type: "change", summary: ch ? `Champion set to ${ch.name}` : "Champion cleared" }); }
    const cc = contactOf(a, el.dataset.id);
    if (act === "contact-status" && cc) logActivity(accId, { type: "change", contact_id: cc.id, contact_name: cc.name, summary: `${cc.name}: ${cStatus(cc.status)} → ${el.value}` });
    if (act === "linkedin-sent" && cc) logActivity(accId, el.checked ? { type: "linkedin", contact_id: cc.id, contact_name: cc.name, summary: `LinkedIn connect sent to ${cc.name}` } : { type: "change", contact_id: cc.id, contact_name: cc.name, summary: `LinkedIn sent unchecked for ${cc.name}` });
    if (act === "contact-status") await w(() => acctRef(accId).update({ contacts: (a.contacts || []).map((c) => c.id === el.dataset.id ? { ...c, status: el.value } : c), updated_at: nowIso() }));
    if (act === "linkedin-sent") await w(() => acctRef(accId).update({ contacts: (a.contacts || []).map((c) => c.id === el.dataset.id ? { ...c, linkedin_sent: el.checked } : c), updated_at: nowIso() }));
  });
  document.addEventListener("submit", async (e) => {
    const f = e.target; e.preventDefault();
    const accId = S.route.id;
    if (f.id === "cl-form") { saveCallLog(); return; }
    if (f.id === "sig-form") {
      if (!S.myOwner) return;
      const sg = sigFromForm();
      const ok = await w(() => S.db.collection("signatures").doc(S.myOwner).set({ ...sg, updated_at: nowIso(), updated_by: S.meId || null }));
      if (ok) { const el = $("sig-saved"); if (el) el.textContent = "Saved."; toast("Signature saved"); }
      return;
    }
    if (f.dataset.form === "tpl") {
      const data = { name: fv(f, "name").trim(), channel: fv(f, "channel") || "email", subject: fv(f, "subject").trim(), body: fv(f, "body"), updated_at: nowIso(), updated_by: S.myOwner || "" };
      if (!data.name || !data.body.trim()) return;
      if (data.channel === "email" && !data.subject) { toast("Email templates need a subject."); return; }
      if (data.channel === "linkedin_note" && data.body.trim().length > 300) { toast(`Connection notes max out at 300 characters on LinkedIn. This one is ${data.body.trim().length}.`); return; }
      const id = f.dataset.id || rid("tpl");
      if (!f.dataset.id) { data.created_at = nowIso(); data.created_by = S.myOwner || ""; }
      const ok = await w(() => f.dataset.id ? S.db.collection("templates").doc(id).update(data) : S.db.collection("templates").doc(id).set(data));
      if (ok) { S.tplEdit = null; renderEmailSettings(); toast("Template saved"); }
      return;
    }
    if (f.id === "intake") {
      if (!ziReady()) return;
      const owner = $("in-owner").value; store.set("prospectOwner", owner);
      const lines = $("in-names").value.split(/\n/).map((s) => s.trim()).filter(Boolean);
      if (!lines.length) { toast("Enter at least one company name or domain."); $("in-names").focus(); return; }
      if (lines.length > 5) { toast("Enter at most 5 companies at a time (aim for 1–2 a day)."); return; }
      $("in-names").value = "";
      startJobs(lines.map((l) => ({ input: l })), owner);
    } else if (f.id === "add-account-form") {
      const name = $("na-name").value.trim(); if (!name) return;
      const dom = normDomain($("na-domain").value);
      const dupe = findAccount({ domain: dom, name });
      if (dupe) { toast(`${dupe[1].company_name} is already on the board.`); location.hash = `#account-${dupe[0]}`; return; }
      const id = rid("a");
      const ok = await w(() => acctRef(id).set({ owner: $("na-owner").value, band: "outbound", company_name: name, domain: dom, stage: $("na-stage").value, source: "manual", sf_opportunity_id: null, amount: null, close_date: null, sf_owner: "", last_activity_date: null, contacts: [], created_at: nowIso(), updated_at: nowIso(), created_by: S.meId || null, created_by_name: S.myOwner || "" }));
      if (ok) { S.addAccount = false; f.reset(); logActivity(id, { type: "system", summary: "Added as an outbound target" }); location.hash = `#account-${id}`; }
    } else if (f.id === "task-form") {
      const ok = await addTask(accId, $("nt-title").value, $("nt-due").value, $("nt-contact").value, "manual");
      if (ok) { $("nt-title").value = ""; $("nt-title").focus(); }
    } else if (f.id === "note-form") {
      const body = $("nn-body").value.trim(); if (!body) return; const id = rid("n");
      const ok = await w(() => noteRef(id).set({ account_id: accId, author: S.myOwner || S.meName || "Someone", author_id: S.meId || null, body: body.slice(0, 8000), created_at: nowIso() }));
      if (ok) { $("nn-body").value = ""; touch(accId); }
    } else if (f.dataset.form === "edit-task") {
      const id = f.dataset.id; const title = fv(f, "title").trim(); if (!title) return;
      S.editTask = null;
      await w(() => taskRef(id).update({ title: title.slice(0, 300), due_date: fv(f, "due") || today(), contact_id: fv(f, "contact") || null }));
      renderDetail();
    } else if (f.dataset.form === "contact") {
      const a = S.accounts.get(accId); if (!a) return;
      const vals = { name: fv(f, "name").trim(), title: fv(f, "title").trim(), email: fv(f, "email").trim(), phone: fv(f, "phone").trim(), mobile: fv(f, "mobile").trim(), linkedin_url: fv(f, "linkedin").trim() };
      if (!vals.name) return;
      let cs = Array.isArray(a.contacts) ? a.contacts.slice() : [];
      if (f.dataset.id) cs = cs.map((c) => c.id === f.dataset.id ? { ...c, ...vals } : c);
      else cs.push({ id: rid("c"), ...vals, source: "manual", is_primary: !cs.some((c) => c.is_primary), status: "Not started", linkedin_sent: false, added_at: nowIso() });
      S.editContact = null; S.addContact = false;
      await w(() => acctRef(accId).update({ contacts: cs, updated_at: nowIso() }));
      renderDetail();
    }
  });

  function renderAll() { renderOwnerSeg(); renderBanner(); renderToday(); renderAccounts(); renderDetail(); renderProspect(); renderEmailSettings(); renderMqls(); renderSignals(); renderDash(); }

  // ---------- boot ----------
  S.route = parseHash(); showView(S.route);
  renderAll();
  let lastDay = today(); setInterval(() => { if (today() !== lastDay) { lastDay = today(); renderAll(); } else if (S.route.view === "today") { renderSchedule(); loadCalendar(false); } }, 60000);

  (async () => {
    const use = (n) => (window.claude && window.claude.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null));
    const timer = setTimeout(() => { if (!S.db) { S.dbAbsent = true; renderAll(); } }, 10000);
    const [db, user, mcp] = await Promise.all([use("db"), use("user"), use("mcp")]);
    clearTimeout(timer);
    S.db = db; S.user = user; S.mcp = mcp; S.dbAbsent = !db;
    if (user) {
      try { const me = await user.me(); S.meId = me && me.id; S.meName = (me && me.name) || ""; } catch {}
      try { S.canWrite = await user.can("data.write"); } catch { S.canWrite = null; }
      const first = (S.meName || "").split(/\s+/)[0];
      if (OWNERS.includes(first) && S.myOwner !== first) { S.myOwner = first; store.set("me", first); if ($("in-owner")) $("in-owner").value = first; }
    }
    if (db) {
      const onErr = (e) => { console.error("db", e); S.dbErr = e && e.code === "revoked" ? "Your access to this board changed. Reload the page." : `The board couldn't load (${(e && e.code) || "error"}). Reload the page.`; S.loaded.a = S.loaded.t = S.loaded.o = true; renderAll(); };
      const loadT = setTimeout(() => { if (!S.loaded.a || !S.loaded.t) { S.dbErr = "The board is taking a while to load. Check your connection and reload."; renderBanner(); } }, 10000);
      const settle = () => { if (S.loaded.a && S.loaded.t) { clearTimeout(loadT); if (S.dbErr.startsWith("The board is taking")) S.dbErr = ""; } };
      db.collection("accounts").limit(1000).onSnapshot((snap) => { S.accounts = new Map(snap.docs.map((d) => [d.id, d.data()])); S.loaded.a = true; settle(); renderAll(); }, onErr);
      db.collection("tasks").limit(1000).onSnapshot((snap) => { S.tasks = new Map(snap.docs.map((d) => [d.id, d.data()])); S.loaded.t = true; settle(); renderAll(); }, onErr);
      db.collection("prefs").limit(20).onSnapshot((snap) => { S.prefs = new Map(snap.docs.map((d) => [d.id, d.data()])); renderHubspotSettings(); renderMqls(); }, () => {});
      db.collection("hs_audit").limit(500).onSnapshot((snap) => { S.hsAudit = new Map(snap.docs.map((d) => [d.id, d.data()])); renderHubspotSettings(); }, () => {});
      db.collection("triage").limit(1000).onSnapshot((snap) => { S.triage = new Map(snap.docs.map((d) => [d.id, d.data()])); renderMqls(); renderSignals(); }, () => {});
      db.collection("templates").limit(200).onSnapshot((snap) => { S.templates = new Map(snap.docs.map((d) => [d.id, d.data()])); renderEmailSettings(); }, () => {});
      db.collection("signatures").limit(50).onSnapshot((snap) => { S.sigs = new Map(snap.docs.map((d) => [d.id, d.data()])); S._sigFor = null; renderEmailSettings(); }, () => {});
      db.collection("ondeck").limit(1000).onSnapshot((snap) => { S.ondeck = new Map(snap.docs.map((d) => [d.id, d.data()])); S.loaded.o = true; renderProspect(); }, () => { S.loaded.o = true; renderProspect(); });
      db.doc("meta/settings").onSnapshot((snap) => { S.settings = (snap.exists && snap.data()) || {}; renderAccounts(); }, () => {});
      if (S.route.view === "account") { S.notesFor = null; subscribeNotes(S.route.id); }
    }
    renderAll();
    await Promise.all([checkZoomInfo(), checkGmail()]);
    renderEmailSettings(); if (S.compose) renderCompose();
    if (S.route.view === "today") renderSchedule();
    renderProspect(); renderJobs();
  })();
})();
</script>
