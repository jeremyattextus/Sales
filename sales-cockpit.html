<title>TextUs Sales Cockpit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600&family=Raleway:ital,wght@0,400;0,500;0,600;1,500&display=swap">
<style>
/* Layout: navy app bar with the owner toggle; one work column below. Today is a flat checklist, Accounts is a ledger, an account is tasks + notes beside contacts + Gong. */
:root {
  --navy: #1D4277;
  --blue: #069FFF;
  --green: #02E584;
  --purple: #D26AE9;
  --bg: #F6F7F9;
  --surface: #FFFFFF;
  --surface-2: #EEF2F8;
  --ink: #17191B;
  --heading: #1D4277;
  --muted: #5A6880;
  --line: #DCE3EE;
  --link: #0A78C2;
  --btn: #1D4277;
  --btn-ink: #FFFFFF;
  --btn-2: #E4ECF7;
  --btn-2-ink: #1D4277;
  --focus: #069FFF;
  --ok: #0B8A55; --ok-soft: #DDF8EC;
  --bad: #C13540; --bad-soft: #FBE6E8;
  --warn: #9A6B00; --warn-soft: #FFF3D6;
  --gong: #9B3DB4; --gong-soft: #F8EAFC;
  --deal-soft: #E1F2FF; --deal-ink: #0A5E99;
  --tgt-soft: #DDF8EC; --tgt-ink: #0B7A4B;
  --bar: #1D4277; --bar-ink: #FFFFFF; --bar-muted: #AFC3E2; --bar-seg: #16365F; --bar-seg-on: #FFFFFF; --bar-seg-on-ink: #1D4277;
  --font-head: 'Alexandria', 'Helvetica Neue', Arial, sans-serif;
  --font-body: 'Raleway', 'Helvetica Neue', Arial, sans-serif;
  --grad: linear-gradient(90deg, #069FFF 0%, #02E584 100%);
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1524; --surface: #132036; --surface-2: #1A2A45; --ink: #E8EDF5; --heading: #F2F6FB; --muted: #9AA9C0; --line: #26385A;
    --link: #5CC0FF; --btn: #069FFF; --btn-ink: #0C1524; --btn-2: #1F3253; --btn-2-ink: #D9E6F7; --focus: #5CC0FF;
    --ok: #3FE3A0; --ok-soft: #0F3427; --bad: #FF8A93; --bad-soft: #3B1A20; --warn: #F2C35B; --warn-soft: #382B10;
    --gong: #E6A2F5; --gong-soft: #31203D; --deal-soft: #12304F; --deal-ink: #8FD0FF; --tgt-soft: #0F3427; --tgt-ink: #4BE3A6;
    --bar: #102446; --bar-ink: #FFFFFF; --bar-muted: #93A8C8; --bar-seg: #0A1830; --bar-seg-on: #E8EDF5; --bar-seg-on-ink: #102446;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1524; --surface: #132036; --surface-2: #1A2A45; --ink: #E8EDF5; --heading: #F2F6FB; --muted: #9AA9C0; --line: #26385A;
  --link: #5CC0FF; --btn: #069FFF; --btn-ink: #0C1524; --btn-2: #1F3253; --btn-2-ink: #D9E6F7; --focus: #5CC0FF;
  --ok: #3FE3A0; --ok-soft: #0F3427; --bad: #FF8A93; --bad-soft: #3B1A20; --warn: #F2C35B; --warn-soft: #382B10;
  --gong: #E6A2F5; --gong-soft: #31203D; --deal-soft: #12304F; --deal-ink: #8FD0FF; --tgt-soft: #0F3427; --tgt-ink: #4BE3A6;
  --bar: #102446; --bar-ink: #FFFFFF; --bar-muted: #93A8C8; --bar-seg: #0A1830; --bar-seg-on: #E8EDF5; --bar-seg-on-ink: #102446;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bar); }
h1, h2, h3 { font-family: var(--font-head); color: var(--heading); margin: 0; text-wrap: balance; font-weight: 500; }
h1 { font-size: 30px; line-height: 1.15; letter-spacing: -.01em; }
h2 { font-size: 15px; font-weight: 500; letter-spacing: .01em; }
h3 { font-size: 14px; }
a { color: var(--link); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.eyebrow { font-family: var(--font-head); font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* App bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bar); color: var(--bar-ink); }
.bar::after { content: ""; display: block; height: 3px; background: var(--grad); }
.bar-in { max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
.brand img { height: 30px; width: auto; display: block; }
.brand span { font-family: var(--font-head); font-weight: 300; font-size: 15px; color: var(--bar-muted); border-left: 1px solid rgba(255,255,255,.25); padding-left: 12px; white-space: nowrap; }
.nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav a { color: var(--bar-muted); text-decoration: none; font-family: var(--font-head); font-size: 14px; padding: 7px 12px; border-radius: 8px; display: inline-flex; gap: 7px; align-items: center; }
.nav a:hover { color: var(--bar-ink); }
.nav a[aria-current="page"] { color: var(--bar-ink); background: rgba(255,255,255,.1); }
.nav .count { background: var(--blue); color: #0C1524; border-radius: 999px; font-size: 11px; padding: 0 7px; line-height: 18px; font-weight: 600; }
.nav .count.over { background: #FF8A93; }
.bar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--bar-seg); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; color: var(--bar-muted); padding: 5px 13px; border-radius: 999px; font-family: var(--font-head); font-size: 13px; cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--bar-seg-on); color: var(--bar-seg-on-ink); }
.who { font-size: 13px; color: var(--bar-muted); display: flex; align-items: center; gap: 6px; }
.who select { background: var(--bar-seg); color: var(--bar-ink); border: 0; border-radius: 6px; padding: 3px 6px; font-size: 13px; }

/* Page */
main { max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 26px 64px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
main > section, main > section > div { min-width: 0; }
main > section > div { grid-template-columns: minmax(0, 1fr); }
.banner { border-radius: var(--radius); padding: 10px 14px; font-size: 14px; background: var(--warn-soft); color: var(--warn); }
.banner.info { background: var(--deal-soft); color: var(--deal-ink); }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.page-head .sub { font-family: var(--font-head); font-weight: 300; font-size: 15px; color: var(--muted); margin-top: 4px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px 10px; flex-wrap: wrap; }
.panel-body { padding: 0 16px 16px; display: grid; gap: 10px; }

/* Buttons and fields */
.btn { display: inline-flex; align-items: center; gap: 7px; border: 0; border-radius: 8px; padding: 8px 14px; background: var(--btn); color: var(--btn-ink); font-family: var(--font-head); font-size: 13.5px; cursor: pointer; white-space: nowrap; text-decoration: none; }
.btn:hover { filter: brightness(1.08); }
.btn.sec { background: var(--btn-2); color: var(--btn-2-ink); }
.btn.ghost { background: transparent; color: var(--muted); padding: 6px 8px; }
.btn.ghost:hover { color: var(--ink); background: var(--surface-2); filter: none; }
.btn.danger { background: var(--bad-soft); color: var(--bad); }
.btn.gong { background: var(--gong-soft); color: var(--gong); }
.btn[disabled] { opacity: .5; cursor: not-allowed; filter: none; }
.icon-btn { border: 0; background: transparent; color: var(--muted); padding: 5px; border-radius: 6px; cursor: pointer; display: inline-flex; }
.icon-btn:hover { color: var(--ink); background: var(--surface-2); }
.field, .sel { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 10px; min-width: 0; font-size: 14px; }
.field:focus, .sel:focus { border-color: var(--focus); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 25%, transparent); }
textarea.field { resize: vertical; min-height: 70px; width: 100%; line-height: 1.5; }
.row-form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row-form .grow { flex: 1 1 220px; }
label.lbl { display: grid; gap: 4px; font-size: 12px; color: var(--muted); font-family: var(--font-head); }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; align-items: end; }

/* Pills */
.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; font-size: 12px; padding: 2px 9px; font-family: var(--font-head); white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.pill.deal { background: var(--deal-soft); color: var(--deal-ink); }
.pill.out { background: var(--surface-2); color: var(--heading); }
.pill.over { background: var(--bad-soft); color: var(--bad); }
.pill.today { background: var(--deal-soft); color: var(--deal-ink); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.gong { background: var(--gong-soft); color: var(--gong); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.owner-dot { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; font-family: var(--font-head); font-size: 11px; background: var(--surface-2); color: var(--heading); flex: none; }

/* Checkbox */
.chk { appearance: none; -webkit-appearance: none; width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--line); background: var(--surface); cursor: pointer; flex: none; display: grid; place-items: center; margin: 0; }
.chk:hover { border-color: var(--ok); }
.chk:checked { background: var(--ok); border-color: var(--ok); }
.chk:checked::after { content: ""; width: 5px; height: 10px; border: solid var(--surface); border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }

/* Today */
.focus-stats { display: flex; gap: 8px; flex-wrap: wrap; }
.stat { display: flex; align-items: baseline; gap: 7px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px 14px 14px 4px; padding: 8px 14px; }
.stat b { font-family: var(--font-head); font-weight: 500; font-size: 22px; color: var(--heading); }
.stat.over b { color: var(--bad); }
.stat span { font-size: 13px; color: var(--muted); }
.tasklist { list-style: none; margin: 0; padding: 0; }
.tasklist > li { display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); }
.tasklist > li:first-child { border-top: 0; }
.tasklist .t-main { flex: 1; min-width: 0; display: grid; gap: 3px; }
.tasklist .t-title { font-weight: 500; overflow-wrap: anywhere; }
.tasklist .t-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--muted); align-items: center; }
.tasklist .t-meta a { color: var(--link); text-decoration: none; font-weight: 500; }
.tasklist .t-meta a:hover { text-decoration: underline; }
.tasklist .t-side { display: flex; align-items: center; gap: 6px; flex: none; }
.tasklist li.done .t-title { text-decoration: line-through; color: var(--muted); }
.group-label { padding: 12px 16px 4px; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); display: grid; gap: 6px; justify-items: center; }
.empty .bubble { font-family: var(--font-head); color: var(--heading); font-size: 17px; background: var(--surface-2); border-radius: 16px 16px 16px 4px; padding: 10px 16px; }

/* Accounts */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
.tabs button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; color: var(--muted); font-family: var(--font-head); font-size: 13.5px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.tabs button[aria-pressed="true"] { background: var(--navy); color: #FFFFFF; }
:root[data-theme="dark"] .tabs button[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tabs button[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); } }
.tabs .n { font-size: 11px; opacity: .75; }
.tools-r { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.table-wrap { overflow-x: auto; }
table.book { width: 100%; border-collapse: collapse; min-width: 680px; }
.book th { text-align: left; font-family: var(--font-head); font-weight: 400; font-size: 12px; color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.book td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.book tr:last-child td { border-bottom: 0; }
.book tbody tr { cursor: pointer; }
.book tbody tr:hover td { background: var(--surface-2); }
.book .co { font-weight: 600; color: var(--heading); }
.book .dom { font-size: 12.5px; color: var(--muted); }
.book .r { text-align: right; }
.taskcount { display: inline-flex; align-items: center; gap: 6px; }
.taskcount .od { width: 7px; height: 7px; border-radius: 50%; background: var(--bad); }
.sync-line { font-size: 13px; color: var(--muted); }
.sync-line.err { color: var(--bad); }

/* Detail */
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; font-size: 14px; }
.back:hover { color: var(--ink); }
.acct-head { padding: 18px 18px 16px; display: grid; gap: 14px; }
.acct-title { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.acct-title h1 { font-size: 28px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px 18px; }
.fact { display: grid; gap: 3px; min-width: 0; }
.fact .v { font-family: var(--font-head); font-size: 15px; color: var(--heading); overflow-wrap: anywhere; }
.fact .v.big { font-size: 20px; }
.fact select.sel { padding: 4px 8px; }
.detail-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.col { display: grid; gap: 18px; min-width: 0; }
@media (max-width: 860px) { .detail-grid { grid-template-columns: minmax(0, 1fr); } }
.sugg { border: 1px dashed color-mix(in srgb, var(--gong) 55%, transparent); background: var(--gong-soft); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; }
.sugg-item { display: flex; gap: 10px; align-items: flex-start; }
.sugg-item p { margin: 0; flex: 1; min-width: 0; font-size: 14px; }
.sugg-item .acts { display: flex; gap: 4px; flex: none; }
.edit-row { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; }
.edit-row .field { flex: 1 1 180px; }
details.done-box summary { cursor: pointer; padding: 10px 16px; color: var(--muted); font-size: 13.5px; list-style: none; border-top: 1px solid var(--line); }
details.done-box summary::-webkit-details-marker { display: none; }
.contact { display: grid; gap: 6px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; }
.contact.primary { border-color: color-mix(in srgb, var(--blue) 55%, var(--line)); }
.contact-top { display: flex; align-items: flex-start; gap: 8px; }
.contact-top .nm { flex: 1; min-width: 0; }
.contact-top .nm b { display: block; color: var(--heading); font-weight: 600; overflow-wrap: anywhere; }
.contact-top .nm span { font-size: 13px; color: var(--muted); }
.contact .lines { display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
.contact .lines span { user-select: all; overflow-wrap: anywhere; }
.contact .foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.star { border: 0; background: transparent; cursor: pointer; color: var(--muted); padding: 3px; border-radius: 6px; display: inline-flex; }
.star.on { color: var(--blue); }
.star.on svg { fill: currentColor; }
.notes { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.note { display: grid; gap: 4px; }
.note .msg { background: var(--surface-2); border-radius: 14px 14px 14px 4px; padding: 10px 13px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; }
.note .by { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.gong-ctx { display: grid; gap: 8px; }
.gong-ctx .msg { background: var(--surface-2); border-radius: 14px 14px 4px 14px; padding: 10px 13px; font-size: 14px; }
.spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
.err { color: var(--bad); font-size: 13.5px; }
.danger-zone { display: flex; justify-content: flex-end; gap: 8px; align-items: center; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 14px; z-index: 50; display: flex; gap: 12px; align-items: center; max-width: calc(100% - 32px); }
.toast[hidden] { display: none; }
.toast button { background: transparent; border: 0; color: var(--blue); font-weight: 600; cursor: pointer; padding: 0; }
@media (max-width: 640px) {
  .brand span { display: none; }
  .bar-right { margin-left: 0; width: 100%; justify-content: space-between; }
  h1 { font-size: 25px; }
  .tasklist > li { padding: 12px; }
}

/* Filters */
.filters { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: flex-end; }
.filters label.lbl { min-width: 0; }
.filters .sel, .filters .field { padding: 6px 9px; font-size: 13.5px; }
.filters .clear { align-self: center; }
.result-note { font-size: 13px; color: var(--muted); }

/* Contacts, sourced */
.tier { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; font-family: var(--font-head); white-space: nowrap; }
.tier.t1 { background: var(--deal-soft); color: var(--deal-ink); }
.tier.t2 { background: var(--gong-soft); color: var(--gong); }
.tier.t3 { background: var(--surface-2); color: var(--heading); }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; padding: 1px 8px; border-radius: 999px; white-space: nowrap; background: var(--surface-2); color: var(--muted); text-decoration: none; font-family: var(--font-head); }
a.chip:hover { color: var(--ink); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.cline { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 13px; }
.cline .k { font-family: var(--font-head); font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); width: 52px; flex: none; }
.cline .v { overflow-wrap: anywhere; user-select: all; min-width: 0; font-variant-numeric: tabular-nums; }
.copy { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 6px; font-size: 11px; padding: 0 7px; line-height: 20px; cursor: pointer; flex: none; }
.copy:hover { color: var(--ink); }
.copy.done { color: var(--ok); border-color: var(--ok); }
.flags { display: flex; flex-wrap: wrap; gap: 4px; }
.calls-note { font-size: 11.5px; color: var(--muted); }
.li-check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
.li-check input { width: 16px; height: 16px; accent-color: var(--blue); }

/* Find targets */
.intake { display: grid; grid-template-columns: minmax(0, 150px) minmax(0, 1fr) auto; gap: 10px; align-items: end; }
@media (max-width: 720px) { .intake { grid-template-columns: minmax(0, 1fr); } }
.intake textarea.field { min-height: 44px; }
.conn-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.conn-pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.conn-pill.ok::before { background: var(--ok); }
.conn-pill.bad { color: var(--bad); }
.conn-pill.bad::before { background: var(--bad); }
.jobs { display: grid; gap: 12px; }
.job { border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); padding: 14px; display: grid; gap: 10px; min-width: 0; }
.job-head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; justify-content: space-between; }
.job-head .name { font-family: var(--font-head); font-size: 16px; color: var(--heading); }
.job-facts { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); }
.job-facts b { color: var(--ink); font-weight: 600; }
.opts { display: grid; gap: 6px; }
.opt { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); text-align: left; cursor: pointer; color: var(--ink); }

.cand th { font-family: var(--font-head); font-weight: 400; font-size: 11.5px; color: var(--muted); background: var(--surface-2); }
.cand tr:last-child td { border-bottom: 0; }

.avail { display: inline-flex; gap: 4px; flex-wrap: wrap; }

.avail i.d { background: var(--warn-soft); color: var(--warn); }
.credit { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; padding: 12px 14px; border-radius: 10px; background: var(--deal-soft); }

.job ul { margin: 0; padding-left: 18px; font-size: 13.5px; }
.od-bar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); }
table.od { border-collapse: collapse; width: 100%; min-width: 640px; }
.od th { text-align: left; font-family: var(--font-head); font-weight: 400; font-size: 12px; color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.od td { padding: 9px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }

/* Deal vs target coding: blue = active deals, green = target accounts */

.champ-btn svg.i { width: 13px; height: 13px; }

.contact.champion { border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); }
.t-meta .via { color: var(--muted); font-size: 12px; }

.nav .dot.tgt { background: var(--green); }
.book.k-deal thead th { background: var(--deal-soft); color: var(--deal-ink); }
.book.k-tgt thead th { background: var(--tgt-soft); color: var(--tgt-ink); }
.book .exp { width: 26px; height: 26px; padding: 0; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; display: inline-grid; place-items: center; flex: none; }
.book .exp svg { transition: transform .15s; width: 14px; height: 14px; }

.book .co-cell { display: flex; align-items: center; gap: 10px; min-width: 0; }
.book tr.open > td { background: var(--surface-2); border-bottom-color: transparent; }
.book tr.xrow { cursor: default; }

.book tr.xrow > td { background: var(--surface-2); padding: 2px 14px 16px 50px; }
.xcontacts { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }

.xmore { font-size: 13px; color: var(--muted); padding-top: 8px; display: flex; gap: 14px; flex-wrap: wrap; }
.tabs button[aria-pressed="true"] .kind { color: inherit; }
.today-tools { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; justify-content: space-between; }

  async function syncSalesforce() {

        if (mode === "convert") { byDomain.delete(dom); byName.delete(normName(acc.Name)); }

          created++;
        } else {

          if (mode === "convert") { patch.owner = ownerFor(r.OwnerId); patch.outbound_stage = a.stage || ""; converted++; } else updated++;

    el.innerHTML = ns.length ? ns.map(([nid, n]) => `<li class="note"><div class="msg">${esc(n.body)}</div><div class="by"><span>${esc(n.author || "Someone")} · ${esc(fmtWhen(n.created_at))}</span>${canWrite() ? `<button class="icon-btn" type="button" data-act="delete-note" data-id="${esc(nid)}" aria-label="Delete note">${ic("trash")}</button>` : ""}</div></li>`).join("") : `<li class="small muted">No notes yet.</li>`;

  // ---------- Find targets: ZoomInfo ----------
  function newJob(input, owner) { return { key: "j" + ++jobSeq, input, owner, state: "resolving", options: [], company: null, multi: false, cands: [], excluded: 0, selected: new Set(), confirming: false, addTask: true, error: "", result: null, accountId: null, ondeckId: null, listInfo: null }; }
  function startJobs(inputs, owner, extra) {
    const jobs = inputs.map((x) => Object.assign(newJob(x.input, owner), x.extra || {}, extra || {}));
    S.jobs.unshift(...jobs);
    renderJobs();
    jobs.forEach(resolveJob);
    return jobs;
  }
  async function resolveJob(job) {
    job.state = "resolving"; job.error = ""; renderJobs();
    const q = job.input.trim();
    const input = looksDomain(q)
      ? { companyWebsite: "https://www." + normDomain(q), pageSize: 10, underManagement: true, userIntent: ZI_INTENT }
      : { companyName: q, pageSize: 10, underManagement: true, userIntent: ZI_INTENT };
    try {
      const p = await callTool(ZI, "search_companies", input);
      const list = ((p && p.data) || []).map((d) => {
        const at = d.attributes || {};
        return { id: String(d.id), name: at.name || "", domain: normDomain(at.website), employees: num(at.employeeCount), city: at.city || "", state: at.state || "", country: at.country || "", managed: !!(at.managementStatus && at.managementStatus.underManagement) };
      }).filter((c) => c.id);
      if (!list.length) { job.state = "error"; job.error = "No ZoomInfo match. Try the company's website domain instead."; }
      else {
        const exact = list.filter((c) => (looksDomain(q) ? c.domain === normDomain(q) : norm(c.name) === norm(q)));
        if (list.length === 1) chooseCompany(job, list[0]);
        else if (exact.length === 1) chooseCompany(job, exact[0]);
        else { job.state = "pick"; job.options = list; }
      }
    } catch (e) { job.state = "error"; job.error = errText(e, ZI); }
    renderJobs();
  }
  function chooseCompany(job, co) {
    job.company = co; job.options = [];
    if (job.accountId) { job.state = "company"; renderJobs(); return; }
    const hit = findAccount({ zid: co.id, domain: co.domain, name: co.name });
    if (hit) { job.state = "dup"; job.dupId = hit[0]; linkOndeck(job, hit[0]); }
    else job.state = "company";
    renderJobs();
  }
  function candFrom(d) {
    const at = d.attributes || {};
    const hasEmail = !!at.hasEmail, hasDirect = !!at.hasDirectPhone, hasMobile = !!at.hasMobilePhone;
    const directDnc = !!at.directPhoneDoNotCall, mobileDnc = !!at.mobilePhoneDoNotCall;
    return {
      id: String(d.id), first: at.firstName || "", last: at.lastName || "", title: at.jobTitle || "",
      tier: tierOf(at.jobTitle), accuracy: num(at.contactAccuracyScore), lastUpdated: at.lastUpdatedDate || "", validDate: at.validDate || "",
      hasEmail, hasDirect, hasMobile, directDnc, mobileDnc,
      callable: hasEmail && ((hasDirect && !directDnc) || (hasMobile && !mobileDnc)),
      managed: !!(at.managementStatus && at.managementStatus.underManagement), onBoard: false,
    };
  }
  function orderCands(cands, multi) {
    const ok = (c) => !c.onBoard && c.callable;
    const byTier = (t) => cands.filter((c) => c.tier === t).sort((a, b) => (ok(b) - ok(a)) || ((b.accuracy || 0) - (a.accuracy || 0)));
    const t1 = byTier(1), t2 = byTier(2), t3 = byTier(3);
    if (!multi) return [...t1, ...t2, ...t3];
    const lead = t2.filter(ok).slice(0, 2);
    return [...lead, ...t1, ...t2.filter((c) => !lead.includes(c)), ...t3];
  }
  const targetN = (job) => (job.multi ? 5 : 3);
  function preselect(job) {
    job.cands = orderCands(job.cands, job.multi);
    job.selected = new Set(job.cands.filter((c) => !c.onBoard && c.callable).slice(0, targetN(job)).map((c) => c.id));
    job.confirming = false;
  }
  async function findContacts(job) {
    const co = job.company;
    job.state = "searching"; job.error = ""; renderJobs();
    const base = { companyIdList: [Number(co.id)], underManagement: true, sort: "-contactAccuracyScore", excludeJobTitleList: EXCLUDE_TITLES, userIntent: ZI_INTENT };
    try {
      const [hr, ops] = await Promise.all([
        callTool(ZI, "search_contacts", { ...base, jobTitleList: HR_TITLES, pageSize: 50 }),
        callTool(ZI, "search_contacts", { ...base, jobTitleList: OPS_TITLES, pageSize: 25 }),
      ]);
      const seen = new Map();
      for (const d of [...((hr && hr.data) || []), ...((ops && ops.data) || [])]) if (d && d.id != null && !seen.has(String(d.id))) seen.set(String(d.id), candFrom(d));
      const all = [...seen.values()];
      job.excluded = all.filter((c) => c.tier === 0).length;
      job.cands = all.filter((c) => c.tier > 0);
      const acc = job.accountId && S.accounts.get(job.accountId);
      if (acc) {
        const have = acc.contacts || [];
        for (const c of job.cands) c.onBoard = have.some((x) => String(x.zoominfo_contact_id || "") === c.id || norm(x.name) === norm(`${c.first} ${c.last}`));
      }
      preselect(job);
      job.state = "review";
    } catch (e) { job.state = "company"; job.error = errText(e, ZI); }
    renderJobs();
  }
  function linkedinFrom(x) {
    const arr = Array.isArray(x) ? x : x ? [x] : [];
    for (const e of arr) { const u = typeof e === "string" ? e : (e && (e.url || e.value)) || ""; if (/linkedin\.com/i.test(u)) return /^https?:/i.test(u) ? u : "https://" + u.replace(/^\/+/, ""); }
    return "";
  }
  async function enrichAndSave(job) {
    const co = job.company;
    const chosen = job.cands.filter((c) => job.selected.has(c.id));
    job.state = "enriching"; job.confirming = false; job.error = ""; renderJobs();
    const notes = [];
    const existing = job.accountId ? S.accounts.get(job.accountId) : null;
    let industry = existing ? existing.industry || "" : "", sub = existing ? existing.sub_industry || "" : "", employees = co.employees;
    if (!existing || !existing.sub_industry) {
      try {
        const p = await spendTool(ZI, "enrich_companies", { companies: [{ companyId: co.id }], requiredFields: ["name", "website", "primaryIndustry", "industries", "employeeCount"], userIntent: ZI_INTENT });
        const r = p && (p.company_1 || Object.values(p).find((v) => v && typeof v === "object" && "success" in v));
        const d = r && r.success ? r.data : null;
        if (d) {
          const pi = Array.isArray(d.primaryIndustry) && d.primaryIndustry.length ? d.primaryIndustry : Array.isArray(d.industries) ? d.industries : [];
          industry = pi[0] || d.industry || ""; sub = pi[1] || "";
          if (num(d.employeeCount) != null) employees = num(d.employeeCount);
        } else notes.push("Company profile (industry) wasn't returned" + (r && r.error ? `: ${r.error}` : "."));
      } catch (e) { notes.push("Company profile: " + errText(e, ZI)); }
    }
    const enriched = [], failed = [];
    let creditsOut = false;
    for (let i = 0; i < chosen.length; i += 10) {
      const batch = chosen.slice(i, i + 10);
      let p;
      try { p = await spendTool(ZI, "enrich_contacts", { contacts: batch.map((c) => ({ personId: c.id })), requiredFields: ENRICH_FIELDS, userIntent: ZI_INTENT }); }
      catch (e) { batch.forEach((c) => failed.push({ c, why: errText(e, ZI) })); continue; }
      if (p && p.creditStatus && /exhaust/i.test(p.creditStatus.type || "")) creditsOut = true;
      const entries = Object.keys(p || {}).filter((k) => /^contact_\d+$/.test(k)).map((k) => p[k]);
      batch.forEach((c, idx) => {
        const r = entries.find((x) => x && x.input && String(x.input.personId) === c.id) || (p && p["contact_" + (idx + 1)]);
        if (r && r.success && r.data) enriched.push({ c, d: r.data });
        else failed.push({ c, why: (r && r.error) || "No record returned" });
      });
    }
    if (!enriched.length) {
      job.state = "review";
      job.error = creditsOut
        ? "ZoomInfo refused the enrichment for lack of credits, so nothing was saved. The connector uses your user's Data (Bulk) credit allowance, which can be empty even when your ZoomInfo account shows credits. Ask your ZoomInfo admin for a Data (Bulk) allowance for the API/MCP integration."
        : "No contacts could be enriched, so nothing was saved. " + (failed[0] ? failed[0].why : "");
      renderJobs(); return;
    }
    const qualified = [], unqualified = [];
    const ts = nowIso();
    for (const { c, d } of enriched) {
      const email = d.email || "", direct = d.phone || d.directPhone || "", mobile = d.mobilePhone || "";
      const directDnc = d.directPhoneDoNotCall === true || (d.directPhoneDoNotCall == null && c.directDnc);
      const mobileDnc = d.mobilePhoneDoNotCall === true || (d.mobilePhoneDoNotCall == null && c.mobileDnc);
      const callable = (direct && !directDnc) || (mobile && !mobileDnc);
      if (email && callable) qualified.push({
        id: "c" + c.id, zoominfo_contact_id: c.id, source: "zoominfo",
        name: `${d.firstName || c.first} ${d.lastName || c.last}`.trim(), title: d.jobTitle || c.title, persona_tier: c.tier,
        email, phone: direct, mobile, phone_dnc: !!directDnc, mobile_dnc: !!mobileDnc, linkedin_url: linkedinFrom(d.externalUrls),
        zi_accuracy: num(d.contactAccuracyScore) != null ? num(d.contactAccuracyScore) : c.accuracy, zi_updated: d.lastUpdatedDate || c.lastUpdated || "",
        status: "Not started", linkedin_sent: false, is_primary: false, added_at: ts,
      });
      else unqualified.push({ c, why: !email ? "no email" : (direct || mobile) ? "only do-not-call numbers" : "no direct or mobile number" });
    }
    let accId = job.accountId;
    try {
      if (existing) {
        const cs = (existing.contacts || []).slice();
        for (const q of qualified) if (!cs.some((x) => String(x.zoominfo_contact_id || "") === q.zoominfo_contact_id)) cs.push(q);
        if (!cs.some((x) => x.is_primary) && cs.length) cs[0] = { ...cs[0], is_primary: true };
        const patch = { contacts: cs, updated_at: ts, zoominfo_company_id: existing.zoominfo_company_id || co.id };
        if (existing.band !== "deal") patch.incomplete = cs.filter((x) => x.email && ((x.phone && !x.phone_dnc) || (x.mobile && !x.mobile_dnc))).length < MIN_QUALIFIED;
        if (!existing.sub_industry && sub) { patch.industry = industry; patch.sub_industry = sub; }
        if (!existing.employee_count && employees) patch.employee_count = employees;
        await acctRef(accId).update(patch);
      } else {
        accId = "azi" + co.id;
        if (qualified.length) qualified[0].is_primary = true;
        await acctRef(accId).set({
          owner: job.owner, band: "outbound", stage: "Target", company_name: co.name, domain: co.domain || "",
          zoominfo_company_id: co.id, industry, sub_industry: sub, employee_count: employees, multi_site: !!job.multi,
          incomplete: qualified.length < MIN_QUALIFIED, source: "zoominfo", contacts: qualified,
          sf_opportunity_id: null, amount: null, close_date: null, sf_owner: "", last_activity_date: null,
          created_at: ts, updated_at: ts, created_by: S.meId || null, created_by_name: S.myOwner || "",
        });
      }
    } catch (e) {
      job.state = "review"; job.error = dbErrText(e) + " Enrichment already ran, so trying again won't use new credits for these contacts.";
      renderJobs(); return;
    }
    if (job.addTask && qualified.length) {
      const first = qualified.find((x) => x.is_primary) || qualified[0];
      await addTask(accId, existing ? `Reach out to ${qualified.length} new contact${qualified.length === 1 ? "" : "s"}` : `Start outreach at ${co.name}`, today(), first.id, "manual");
    }
    job.accountId = accId;
    linkOndeck(job, accId);
    job.state = "saved";

  }
  function linkOndeck(job, accId) {
    let odId = job.ondeckId;

  // ---------- Find targets: On-Deck ----------
  function odState(o, byName) {
    const acc = (o.account_id && S.accounts.get(o.account_id)) || byName.get(norm(o.name));
    if (acc) return { key: "added", acc, id: o.account_id && S.accounts.get(o.account_id) ? o.account_id : acc._id };
    if (o.started_at) return { key: "started" };
    return { key: "ondeck" };
  }
  function accountsByName() { const m = new Map(); for (const [id, a] of S.accounts) m.set(norm(a.company_name), Object.assign({ _id: id }, a)); return m; }
  function parseCsv(text) {
    const rows = []; let row = [], f = "", q = false;
    text = text.replace(/^﻿/, "");
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) { if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
      else if (ch === '"') q = true;
      else if (ch === ",") { row.push(f); f = ""; }
      else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
      else f += ch;
    }
    if (f !== "" || row.length) { row.push(f); rows.push(row); }

      if (jc === "multi") { job.multi = el.checked; if (job.state === "review") preselect(job); }
      else if (jc === "cand") { if (el.checked) { if (job.selected.size < targetN(job)) job.selected.add(el.dataset.id); } else job.selected.delete(el.dataset.id); job.confirming = false; }
      else if (jc === "task") job.addTask = el.checked;
      renderJobs(); return;
    }
    const act = el.dataset && el.dataset.actChange; if (!act) return;
    const accId = el.dataset.acc || S.route.id; const a = S.accounts.get(accId); if (!a) return;
    if (act === "stage") await w(() => acctRef(accId).update({ stage: el.value, updated_at: nowIso() }));
    if (act === "owner") await w(() => acctRef(accId).update({ owner: el.value, updated_at: nowIso() }));
    if (act === "champion") await w(() => acctRef(accId).update({ champion_id: el.value || null, updated_at: nowIso() }));
    if (act === "contact-status") await w(() => acctRef(accId).update({ contacts: (a.contacts || []).map((c) => c.id === el.dataset.id ? { ...c, status: el.value } : c), updated_at: nowIso() }));
    if (act === "linkedin-sent") await w(() => acctRef(accId).update({ contacts: (a.contacts || []).map((c) => c.id === el.dataset.id ? { ...c, linkedin_sent: el.checked } : c), updated_at: nowIso() }));
  });
  document.addEventListener("submit", async (e) => {
    const f = e.target; e.preventDefault();
    const accId = S.route.id;
    if (f.id === "intake") {
      if (!ziReady()) return;
      const owner = $("in-owner").value; store.set("prospectOwner", owner);
      const lines = $("in-names").value.split(/\n/).map((s) => s.trim()).filter(Boolean);
      if (!lines.length) { toast("Enter at least one company name or domain."); $("in-names").focus(); return; }
      if (lines.length > 5) { toast("Enter at most 5 companies at a time (aim for 1–2 a day)."); return; }
      $("in-names").value = "";
      startJobs(lines.map((l) => ({ input: l })), owner);
    } else if (f.id === "add-account-form") {
      const name = $("na-name").value.trim(); if (!name) return;
      const dom = normDomain($("na-domain").value);
      const dupe = findAccount({ domain: dom, name });
      if (dupe) { toast(`${dupe[1].company_name} is already on the board.`); location.hash = `#account-${dupe[0]}`; return; }
      const id = rid("a");
      const ok = await w(() => acctRef(id).set({ owner: $("na-owner").value, band: "outbound", company_name: name, domain: dom, stage: $("na-stage").value, source: "manual", sf_opportunity_id: null, amount: null, close_date: null, sf_owner: "", last_activity_date: null, contacts: [], created_at: nowIso(), updated_at: nowIso(), created_by: S.meId || null, created_by_name: S.myOwner || "" }));
      if (ok) { S.addAccount = false; f.reset(); location.hash = `#account-${id}`; }
    } else if (f.id === "task-form") {
      const ok = await addTask(accId, $("nt-title").value, $("nt-due").value, $("nt-contact").value, "manual");
      if (ok) { $("nt-title").value = ""; $("nt-title").focus(); }
    } else if (f.id === "note-form") {
      const body = $("nn-body").value.trim(); if (!body) return; const id = rid("n");
      const ok = await w(() => noteRef(id).set({ account_id: accId, author: S.myOwner || S.meName || "Someone", author_id: S.meId || null, body: body.slice(0, 8000), created_at: nowIso() }));
      if (ok) { $("nn-body").value = ""; touch(accId); }
    } else if (f.dataset.form === "edit-task") {
      const id = f.dataset.id; const title = fv(f, "title").trim(); if (!title) return;
      S.editTask = null;
      await w(() => taskRef(id).update({ title: title.slice(0, 300), due_date: fv(f, "due") || today(), contact_id: fv(f, "contact") || null }));
      renderDetail();
    } else if (f.dataset.form === "contact") {
      const a = S.accounts.get(accId); if (!a) return;
      const vals = { name: fv(f, "name").trim(), title: fv(f, "title").trim(), email: fv(f, "email").trim(), phone: fv(f, "phone").trim(), mobile: fv(f, "mobile").trim(), linkedin_url: fv(f, "linkedin").trim() };
      if (!vals.name) return;
      let cs = Array.isArray(a.contacts) ? a.contacts.slice() : [];
      if (f.dataset.id) cs = cs.map((c) => c.id === f.dataset.id ? { ...c, ...vals } : c);
      else cs.push({ id: rid("c"), ...vals, source: "manual", is_primary: !cs.some((c) => c.is_primary), status: "Not started", linkedin_sent: false, added_at: nowIso() });
      S.editContact = null; S.addContact = false;
      await w(() => acctRef(accId).update({ contacts: cs, updated_at: nowIso() }));
      renderDetail();
    }
  });

  function renderAll() { renderOwnerSeg(); renderBanner(); renderToday(); renderAccounts(); renderDetail(); renderProspect(); }

  // ---------- boot ----------
  S.route = parseHash(); showView(S.route);
  renderAll();
  let lastDay = today(); setInterval(() => { if (today() !== lastDay) { lastDay = today(); renderAll(); } }, 60000);

  (async () => {
    const use = (n) => (window.claude && window.claude.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null));
    const timer = setTimeout(() => { if (!S.db) { S.dbAbsent = true; renderAll(); } }, 10000);
    const [db, user, mcp] = await Promise.all([use("db"), use("user"), use("mcp")]);
    clearTimeout(timer);
    S.db = db; S.user = user; S.mcp = mcp; S.dbAbsent = !db;
    if (user) {
      try { const me = await user.me(); S.meId = me && me.id; S.meName = (me && me.name) || ""; } catch {}
      try { S.canWrite = await user.can("data.write"); } catch { S.canWrite = null; }
      const first = (S.meName || "").split(/\s+/)[0];
      if (OWNERS.includes(first) && S.myOwner !== first) { S.myOwner = first; store.set("me", first); if ($("in-owner")) $("in-owner").value = first; }
    }
    if (db) {
      const onErr = (e) => { console.error("db", e); S.dbErr = e && e.code === "revoked" ? "Your access to this board changed. Reload the page." : `The board couldn't load (${(e && e.code) || "error"}). Reload the page.`; S.loaded.a = S.loaded.t = S.loaded.o = true; renderAll(); };
      const loadT = setTimeout(() => { if (!S.loaded.a || !S.loaded.t) { S.dbErr = "The board is taking a while to load. Check your connection and reload."; renderBanner(); } }, 10000);
      const settle = () => { if (S.loaded.a && S.loaded.t) { clearTimeout(loadT); if (S.dbErr.startsWith("The board is taking")) S.dbErr = ""; } };
      db.collection("accounts").limit(1000).onSnapshot((snap) => { S.accounts = new Map(snap.docs.map((d) => [d.id, d.data()])); S.loaded.a = true; settle(); renderAll(); }, onErr);
      db.collection("tasks").limit(1000).onSnapshot((snap) => { S.tasks = new Map(snap.docs.map((d) => [d.id, d.data()])); S.loaded.t = true; settle(); renderAll(); }, onErr);
      db.collection("ondeck").limit(1000).onSnapshot((snap) => { S.ondeck = new Map(snap.docs.map((d) => [d.id, d.data()])); S.loaded.o = true; renderProspect(); }, () => { S.loaded.o = true; renderProspect(); });
      db.doc("meta/settings").onSnapshot((snap) => { S.settings = (snap.exists && snap.data()) || {}; renderAccounts(); }, () => {});
      if (S.route.view === "account") { S.notesFor = null; subscribeNotes(S.route.id); }
    }
    renderAll();
    await checkZoomInfo();
    renderProspect(); renderJobs();
  })();
})();
</script>
